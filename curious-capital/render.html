<!DOCTYPE html>
<html><head><meta charset="utf-8">
<style>html,body{margin:0;background:#000;overflow:hidden}canvas{display:block}</style>
<script src="data.js"></script>
</head><body>
<canvas id="c" width="1080" height="1920"></canvas>
<script>
"use strict";
const W = 1080, H = 1920, FPS = 30;
const DURATION = 69.6;
const cv = document.getElementById('c');
const ctx = cv.getContext('2d');

// ---------- palette ----------
const NAVY = '#0a1a36', NAVY2 = '#06112a', NAVY3 = '#13284f', RED = '#e0263a', RED2 = '#b5162a';
const WHITE = '#ffffff', MUTED = 'rgba(255,255,255,0.72)';
const F = (w, s) => `${w} ${s}px Inter, 'Noto Color Emoji', sans-serif`;

// ---------- assets ----------
const IMG = {};
const IMG_NAMES = ['casablanca','bessent','rubio','hegseth','noem','driscoll','miller','bondi','blanche',
  'fortmcnair','fortmcnair_map','anacostia','fortmyer','tesoro'];
function loadImg(n){
  return new Promise(res=>{const im=new Image();im.onload=()=>{IMG[n]=im;res()};im.onerror=()=>{IMG[n]=null;res()};im.src='imagenes/'+n+'.jpg';});
}
// Face focus (fraction of width/height) + zoom for portrait crops
const FACE = {
  bessent:[0.47,0.24,0.55], rubio:[0.44,0.27,0.62], hegseth:[0.45,0.27,0.55], noem:[0.53,0.42,0.75],
  driscoll:[0.45,0.30,0.55], miller:[0.51,0.36,0.70], bondi:[0.47,0.40,0.80], blanche:[0.66,0.28,0.60]
};

// ---------- math ----------
const clamp=(x,a=0,b=1)=>Math.max(a,Math.min(b,x));
const lerp=(a,b,t)=>a+(b-a)*t;
const P=(t,a,b)=>clamp((t-a)/(b-a));
const eOut=x=>1-Math.pow(1-x,3);
const eIn=x=>x*x*x;
const eIO=x=>x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2;
const eBack=x=>{const c1=1.70158,c3=c1+1;return 1+c3*Math.pow(x-1,3)+c1*Math.pow(x-1,2)};
const eElastic=x=>x===0?0:x===1?1:Math.pow(2,-10*x)*Math.sin((x*10-0.75)*(2*Math.PI)/3)+1;

// ---------- drawing helpers ----------
function rr(x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();}
function drawCover(im,x,y,w,h,fx=0.5,fy=0.5,zoom=1){
  if(!im) return null;
  const s=Math.max(w/im.width,h/im.height)*zoom;
  const dw=im.width*s, dh=im.height*s;
  let dx=x+w/2-fx*dw, dy=y+h/2-fy*dh;
  dx=Math.min(x,Math.max(x+w-dw,dx)); dy=Math.min(y,Math.max(y+h-dh,dy));
  ctx.drawImage(im,dx,dy,dw,dh);
  return {dx,dy,s};
}
function portrait(name,x,y,w,h,r=18,zoomMul=1){
  const im=IMG[name]; const f=FACE[name]||[0.5,0.3,0.7];
  ctx.save(); rr(x,y,w,h,r); ctx.clip();
  ctx.fillStyle=NAVY3; ctx.fillRect(x,y,w,h);
  if(im){
    // crop window: height = f[2]*imgH, aspect w/h
    let ch=im.height*f[2]/zoomMul, cw=ch*w/h;
    if(cw>im.width){cw=im.width;ch=cw*h/w;}
    let sx=f[0]*im.width-cw/2, sy=f[1]*im.height-ch*0.42;
    sx=clamp(sx,0,im.width-cw); sy=clamp(sy,0,im.height-ch);
    ctx.drawImage(im,sx,sy,cw,ch,x,y,w,h);
  } else { monogram(name,x,y,w,h); }
  const g=ctx.createLinearGradient(0,y+h*0.55,0,y+h); g.addColorStop(0,'rgba(6,17,42,0)'); g.addColorStop(1,'rgba(6,17,42,0.55)');
  ctx.fillStyle=g; ctx.fillRect(x,y,w,h);
  ctx.restore();
}
function monogram(name,x,y,w,h){ctx.fillStyle=NAVY3;ctx.fillRect(x,y,w,h);ctx.fillStyle='rgba(255,255,255,0.5)';ctx.font=F(900,h*0.3);ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(name[0].toUpperCase(),x+w/2,y+h/2);}

function text(str,x,y,font,color=WHITE,align='center',base='alphabetic'){ctx.font=font;ctx.fillStyle=color;ctx.textAlign=align;ctx.textBaseline=base;ctx.fillText(str,x,y);}
function shadowText(str,x,y,font,color=WHITE,align='center',blur=18){ctx.save();ctx.shadowColor='rgba(0,0,0,0.85)';ctx.shadowBlur=blur;ctx.shadowOffsetY=4;text(str,x,y,font,color,align);ctx.restore();}
function wrap(str,font,maxW){ctx.font=font;const words=str.split(' ');const lines=[];let cur='';for(const w of words){const t=cur?cur+' '+w:w;if(ctx.measureText(t).width>maxW&&cur){lines.push(cur);cur=w}else cur=t}if(cur)lines.push(cur);return lines;}
function tw(str,font){ctx.font=font;return ctx.measureText(str).width;}
function withAlpha(a,fn){ctx.save();ctx.globalAlpha*=clamp(a);fn();ctx.restore();}
function scaleAt(cx,cy,s,fn){ctx.save();ctx.translate(cx,cy);ctx.scale(s,s);ctx.translate(-cx,-cy);fn();ctx.restore();}

// red tag pill
function tag(str,x,y,size=30,bg=RED,fg=WHITE,align='left'){
  const font=F(800,size); const w=tw(str,font)+size*1.1, h=size*1.65;
  const X=align==='center'?x-w/2:align==='right'?x-w:x;
  ctx.fillStyle=bg; rr(X,y,w,h,8); ctx.fill();
  text(str,X+w/2,y+h/2+size*0.36,font,fg,'center');
  return w;
}

// ---------- icons (centered at x,y, size s) ----------
function iconHouse(x,y,s,color=WHITE,lw=0.07){
  ctx.save();ctx.translate(x,y);ctx.scale(s,s);ctx.lineWidth=lw;ctx.strokeStyle=color;ctx.lineJoin='round';ctx.lineCap='round';
  ctx.beginPath();ctx.moveTo(-0.5,-0.02);ctx.lineTo(0,-0.45);ctx.lineTo(0.5,-0.02);ctx.stroke();
  ctx.beginPath();ctx.moveTo(-0.36,-0.12);ctx.lineTo(-0.36,0.42);ctx.lineTo(0.36,0.42);ctx.lineTo(0.36,-0.12);ctx.stroke();
  ctx.beginPath();ctx.rect(-0.09,0.14,0.18,0.28);ctx.stroke();
  ctx.beginPath();ctx.moveTo(0.22,-0.27);ctx.lineTo(0.22,-0.4);ctx.lineTo(0.3,-0.4);ctx.lineTo(0.3,-0.2);ctx.stroke();
  ctx.restore();
}
function starPath(cx,cy,R,r){ctx.beginPath();for(let i=0;i<10;i++){const a=-Math.PI/2+i*Math.PI/5;const rad=i%2?r:R;ctx.lineTo(cx+Math.cos(a)*rad,cy+Math.sin(a)*rad);}ctx.closePath();}
function iconBase(x,y,s,color=WHITE,fill=RED){
  ctx.save();ctx.translate(x,y);ctx.scale(s,s);ctx.lineJoin='round';
  // shield
  ctx.beginPath();ctx.moveTo(0,-0.5);ctx.bezierCurveTo(0.22,-0.38,0.38,-0.38,0.44,-0.38);ctx.lineTo(0.44,0.02);ctx.bezierCurveTo(0.44,0.28,0.2,0.42,0,0.52);ctx.bezierCurveTo(-0.2,0.42,-0.44,0.28,-0.44,0.02);ctx.lineTo(-0.44,-0.38);ctx.bezierCurveTo(-0.38,-0.38,-0.22,-0.38,0,-0.5);ctx.closePath();
  ctx.fillStyle=fill;ctx.fill();ctx.lineWidth=0.06;ctx.strokeStyle=color;ctx.stroke();
  starPath(0,0.0,0.24,0.1);ctx.fillStyle=color;ctx.fill();
  ctx.restore();
}
function iconArrow(x1,y,x2,p,color=RED,lw=12){
  if(p<=0)return; const xe=lerp(x1,x2,p);
  ctx.save();ctx.strokeStyle=color;ctx.fillStyle=color;ctx.lineWidth=lw;ctx.lineCap='round';
  ctx.beginPath();ctx.moveTo(x1,y);ctx.lineTo(xe-lw,y);ctx.stroke();
  ctx.beginPath();ctx.moveTo(xe+lw*0.6,y);ctx.lineTo(xe-lw*2.4,y-lw*2.2);ctx.lineTo(xe-lw*2.4,y+lw*2.2);ctx.closePath();ctx.fill();
  ctx.restore();
}
function iconPin(x,y,s,color=RED,glyph=null,glyphColor=WHITE){
  // tip at (x,y)
  ctx.save();ctx.translate(x,y);ctx.scale(s,s);
  ctx.shadowColor='rgba(0,0,0,0.6)';ctx.shadowBlur=0.25;ctx.shadowOffsetY=0.06;
  ctx.beginPath();ctx.moveTo(0,0);ctx.bezierCurveTo(-0.15,-0.35,-0.5,-0.6,-0.5,-1.0);ctx.arc(0,-1.0,0.5,Math.PI,0);ctx.bezierCurveTo(0.5,-0.6,0.15,-0.35,0,0);ctx.closePath();
  ctx.fillStyle=color;ctx.fill();ctx.shadowColor='transparent';ctx.lineWidth=0.06;ctx.strokeStyle=WHITE;ctx.stroke();
  if(glyph){ctx.font=F(900,0.62);ctx.fillStyle=glyphColor;ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(glyph,0,-0.98);}
  else{ctx.beginPath();ctx.arc(0,-1.0,0.2,0,7);ctx.fillStyle=WHITE;ctx.fill();}
  ctx.restore();
}
function iconHeadstone(x,y,s,color=WHITE){
  ctx.save();ctx.translate(x,y);ctx.scale(s,s);ctx.lineWidth=0.07;ctx.strokeStyle=color;ctx.lineJoin='round';
  ctx.beginPath();ctx.moveTo(-0.3,0.42);ctx.lineTo(-0.3,-0.15);ctx.arc(0,-0.15,0.3,Math.PI,0);ctx.lineTo(0.3,0.42);ctx.stroke();
  ctx.beginPath();ctx.moveTo(-0.45,0.42);ctx.lineTo(0.45,0.42);ctx.stroke();
  ctx.beginPath();ctx.moveTo(0,-0.28);ctx.lineTo(0,0.18);ctx.moveTo(-0.14,-0.12);ctx.lineTo(0.14,-0.12);ctx.stroke();
  ctx.restore();
}
function iconMissile(x,y,s,color=WHITE){
  ctx.save();ctx.translate(x,y);ctx.scale(s,s);ctx.rotate(-Math.PI/4);ctx.lineWidth=0.06;ctx.strokeStyle=color;ctx.lineJoin='round';
  ctx.beginPath();ctx.moveTo(0,-0.55);ctx.bezierCurveTo(0.14,-0.4,0.14,-0.25,0.14,-0.2);ctx.lineTo(0.14,0.3);ctx.lineTo(-0.14,0.3);ctx.lineTo(-0.14,-0.2);ctx.bezierCurveTo(-0.14,-0.25,-0.14,-0.4,0,-0.55);ctx.closePath();ctx.stroke();
  ctx.beginPath();ctx.moveTo(-0.14,0.1);ctx.lineTo(-0.3,0.34);ctx.lineTo(-0.14,0.3);ctx.moveTo(0.14,0.1);ctx.lineTo(0.3,0.34);ctx.lineTo(0.14,0.3);ctx.stroke();
  ctx.fillStyle=RED;ctx.beginPath();ctx.moveTo(-0.1,0.36);ctx.lineTo(0,0.58);ctx.lineTo(0.1,0.36);ctx.closePath();ctx.fill();
  ctx.restore();
}
function iconCapsule(x,y,s,color=WHITE){
  ctx.save();ctx.translate(x,y);ctx.scale(s,s);ctx.rotate(-Math.PI/4);ctx.lineWidth=0.06;ctx.strokeStyle=color;
  rr(-0.18,-0.5,0.36,1.0,0.18);ctx.stroke();
  ctx.save();rr(-0.18,-0.5,0.36,1.0,0.18);ctx.clip();ctx.fillStyle=RED;ctx.fillRect(-0.2,-0.52,0.4,0.52);ctx.restore();
  rr(-0.18,-0.5,0.36,1.0,0.18);ctx.stroke();
  ctx.beginPath();ctx.moveTo(-0.18,0);ctx.lineTo(0.18,0);ctx.stroke();
  ctx.restore();
}
function iconAlert(x,y,s,color=WHITE){
  ctx.save();ctx.translate(x,y);ctx.scale(s,s);ctx.lineWidth=0.07;ctx.strokeStyle=color;ctx.lineJoin='round';
  ctx.beginPath();ctx.moveTo(0,-0.48);ctx.lineTo(0.5,0.4);ctx.lineTo(-0.5,0.4);ctx.closePath();ctx.stroke();
  ctx.fillStyle=RED;ctx.fillRect(-0.04,-0.18,0.08,0.34);ctx.beginPath();ctx.arc(0,0.27,0.05,0,7);ctx.fill();
  ctx.restore();
}
function iconMagnifier(x,y,s,p=1){
  // lens circle, red handle, "?" inside
  ctx.save();ctx.translate(x,y);ctx.scale(s,s);ctx.lineCap='round';
  const a=eOut(P(p,0,0.45));
  ctx.beginPath();ctx.arc(-0.08,-0.08,0.36,0,7);ctx.fillStyle=NAVY;ctx.globalAlpha=a;ctx.fill();ctx.globalAlpha=1;
  ctx.lineWidth=0.09;ctx.strokeStyle=WHITE;ctx.beginPath();ctx.arc(-0.08,-0.08,0.36,-Math.PI/2,-Math.PI/2+Math.PI*2*a);ctx.stroke();
  const hp=eOut(P(p,0.35,0.7));
  if(hp>0){ctx.strokeStyle=RED;ctx.lineWidth=0.16;ctx.beginPath();ctx.moveTo(0.19,0.19);ctx.lineTo(0.19+0.28*hp,0.19+0.28*hp);ctx.stroke();}
  const qp=eBack(P(p,0.6,1));
  if(qp>0){ctx.save();ctx.translate(-0.08,-0.06);ctx.scale(qp,qp);ctx.font=F(900,0.5);ctx.fillStyle=RED;ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText('?',0,0.02);ctx.restore();}
  ctx.restore();
}
function iconShield(x,y,s){iconBase(x,y,s,WHITE,'#1f5fbf');}
function iconBarrier(x,y,s){
  ctx.save();ctx.translate(x,y);ctx.scale(s,s);
  ctx.save();rr(-0.5,-0.22,1.0,0.26,0.05);ctx.clip();ctx.fillStyle=WHITE;ctx.fillRect(-0.5,-0.22,1,0.26);ctx.fillStyle=RED;
  for(let i=-3;i<6;i++){ctx.beginPath();ctx.moveTo(-0.5+i*0.2,0.04);ctx.lineTo(-0.4+i*0.2,-0.22);ctx.lineTo(-0.3+i*0.2,-0.22);ctx.lineTo(-0.4+i*0.2,0.04);ctx.closePath();ctx.fill();}
  ctx.restore();
  ctx.lineWidth=0.07;ctx.strokeStyle=WHITE;ctx.lineCap='round';
  ctx.beginPath();ctx.moveTo(-0.35,0.04);ctx.lineTo(-0.45,0.48);ctx.moveTo(-0.35,0.04);ctx.lineTo(-0.2,0.48);ctx.moveTo(0.35,0.04);ctx.lineTo(0.45,0.48);ctx.moveTo(0.35,0.04);ctx.lineTo(0.2,0.48);ctx.stroke();
  ctx.fillStyle='#ffb020';ctx.beginPath();ctx.arc(-0.35,-0.34,0.08,0,7);ctx.arc(0.35,-0.34,0.08,0,7);ctx.fill();
  ctx.restore();
}
function iconComment(x,y,s){
  ctx.save();ctx.translate(x,y);ctx.scale(s,s);ctx.fillStyle=WHITE;
  rr(-0.5,-0.4,1,0.66,0.16);ctx.fill();ctx.beginPath();ctx.moveTo(-0.25,0.2);ctx.lineTo(-0.32,0.48);ctx.lineTo(0.02,0.24);ctx.fill();
  ctx.fillStyle=RED;[-0.22,0,0.22].forEach(d=>{ctx.beginPath();ctx.arc(d,-0.07,0.07,0,7);ctx.fill();});
  ctx.restore();
}

// ---------- background / grain ----------
const grains=[];
function makeGrain(){for(let k=0;k<6;k++){const c=document.createElement('canvas');c.width=270;c.height=480;const g=c.getContext('2d');const d=g.createImageData(270,480);let seed=k*9973+1;for(let i=0;i<d.data.length;i+=4){seed=(seed*16807)%2147483647;const v=seed%255;d.data[i]=d.data[i+1]=d.data[i+2]=v;d.data[i+3]=255;}g.putImageData(d,0,0);grains.push(c);}}
function baseBg(){const g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,'#0c1f40');g.addColorStop(1,'#040b1c');ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
  ctx.save();ctx.globalAlpha=0.06;ctx.strokeStyle='#5d86c8';ctx.lineWidth=1;for(let x=0;x<=W;x+=60){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,H);ctx.stroke();}for(let y=0;y<=H;y+=60){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(W,y);ctx.stroke();}ctx.restore();}
function photoBg(name,t,t0,dur,fx=0.5,fy=0.5,dark=0.62,blur=0){
  const im=IMG[name];
  if(!im){baseBg();return;}
  const z=1.06+0.10*P(t,t0,t0+dur);
  ctx.save(); if(blur) ctx.filter=`blur(${blur}px)`;
  drawCover(im,-20,-20,W+40,H+40,fx,fy,z); ctx.restore();
  ctx.fillStyle=`rgba(6,17,42,${dark})`;ctx.fillRect(0,0,W,H);
  const g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,'rgba(4,11,28,0.85)');g.addColorStop(0.22,'rgba(4,11,28,0.15)');g.addColorStop(0.7,'rgba(4,11,28,0.3)');g.addColorStop(1,'rgba(4,11,28,0.95)');ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
}
function vignetteAndGrain(frame){
  const g=ctx.createRadialGradient(W/2,H/2,H*0.3,W/2,H/2,H*0.75);g.addColorStop(0,'rgba(0,0,0,0)');g.addColorStop(1,'rgba(0,0,0,0.55)');ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
  ctx.save();ctx.globalAlpha=0.045;ctx.globalCompositeOperation='overlay';ctx.drawImage(grains[frame%grains.length],0,0,W,H);ctx.restore();
}

// ---------- MAP ----------
const LAT0=38.87, COSL=Math.cos(LAT0*Math.PI/180);
const POTOMAC=[[38.912,-77.080],[38.903,-77.068],[38.893,-77.060],[38.884,-77.051],[38.876,-77.044],[38.866,-77.039],[38.855,-77.036],[38.842,-77.035],[38.828,-77.038],[38.812,-77.041],[38.795,-77.040]];
const WCHANNEL=[[38.882,-77.031],[38.874,-77.026],[38.866,-77.0225],[38.858,-77.0225],[38.853,-77.026]];
const ANACOSTIA=[[38.852,-77.026],[38.856,-77.0185],[38.861,-77.0115],[38.866,-77.0055],[38.871,-76.999],[38.874,-76.988],[38.877,-76.978],[38.884,-76.971],[38.895,-76.964],[38.905,-76.958]];
const TIDAL=[[38.884,-77.031],[38.8845,-77.036],[38.8815,-77.040],[38.879,-77.036]];
const BASES={
  mcnair:{name:['FORT McNAIR'],poly:[[38.8705,-77.0205],[38.8705,-77.0128],[38.8625,-77.0140],[38.8585,-77.0175],[38.8595,-77.0205]],c:[38.865,-77.017]},
  jbab:{name:['JOINT BASE','ANACOSTIA-BOLLING'],poly:[[38.8525,-77.0265],[38.8515,-77.0125],[38.846,-77.004],[38.830,-77.006],[38.826,-77.024]],c:[38.841,-77.015]},
  myer:{name:['JOINT BASE','MYER-HENDERSON HALL'],poly:[[38.8855,-77.0855],[38.8855,-77.0725],[38.8790,-77.0715],[38.8775,-77.0805],[38.8805,-77.0860]],c:[38.8815,-77.079]},
};
const CEMETERY={poly:[[38.8835,-77.0712],[38.8835,-77.0605],[38.8745,-77.0598],[38.8730,-77.0700]],c:[38.879,-77.0655]};
const WH=[38.8977,-77.0365];
// Map camera keyframes [time, lat, lon, k(px/deg)]
const CAM=[
  [18.6,38.868,-77.030,9500],[20.4,38.868,-77.030,9800],[21.6,38.8645,-77.0175,30000],
  [24.15,38.8645,-77.0175,30000],[25.3,38.846,-77.018,15000],
  [30.15,38.846,-77.018,15000],[31.4,38.8805,-77.0735,21000],
  [36.8,38.8805,-77.0735,21000],[36.95,38.872,-77.030,8200],
  [53.6,38.869,-77.047,11000],[59.5,38.869,-77.047,11800],
];
function camAt(t){
  if(t<=CAM[0][0])return CAM[0].slice(1);
  for(let i=0;i<CAM.length-1;i++){const a=CAM[i],b=CAM[i+1];if(t<=b[0]){const u=eIO(P(t,a[0],b[0]));return [lerp(a[1],b[1],u),lerp(a[2],b[2],u),Math.exp(lerp(Math.log(a[3]),Math.log(b[3]),u))];}}
  return CAM[CAM.length-1].slice(1);
}
let MAPV=null; // current map view transform
function proj(ll){const v=MAPV;return [v.cx+(ll[1]-v.lon)*COSL*v.k, v.cy-(ll[0]-v.lat)*v.k];}
function smoothPath(pts){const p=pts.map(proj);ctx.beginPath();ctx.moveTo(p[0][0],p[0][1]);for(let i=1;i<p.length-1;i++){const mx=(p[i][0]+p[i+1][0])/2,my=(p[i][1]+p[i+1][1])/2;ctx.quadraticCurveTo(p[i][0],p[i][1],mx,my);}ctx.lineTo(p[p.length-1][0],p[p.length-1][1]);}
function polyPath(pts){const p=pts.map(proj);ctx.beginPath();p.forEach((q,i)=>i?ctx.lineTo(q[0],q[1]):ctx.moveTo(q[0],q[1]));ctx.closePath();}
function river(pts,wDeg){
  const w=wDeg*ctx._k;
  ctx.lineCap='round';ctx.lineJoin='round';
  smoothPath(pts);ctx.strokeStyle='#3f74c4';ctx.lineWidth=w+6;ctx.stroke();
  smoothPath(pts);ctx.strokeStyle='#081a3a';ctx.lineWidth=w;ctx.stroke();
}
function drawMap(t,rect,opts={}){
  const [x,y,w,h]=rect;
  const [lat,lon,k]=opts.cam||camAt(t);
  MAPV={lat,lon,k,cx:x+w/2,cy:y+h/2}; ctx._k=k;
  ctx.save(); rr(x,y,w,h,26); ctx.clip();
  // land
  ctx.fillStyle='#14305c';ctx.fillRect(x,y,w,h);
  // street grid (DC side, rotated slightly) — drawn in geo coordinates
  ctx.save();ctx.globalAlpha=0.22;ctx.strokeStyle='#4c74b0';ctx.lineWidth=1.2;
  const step=0.004;
  for(let la=38.80;la<=38.93;la+=step){const a=proj([la,-77.12]),b=proj([la,-76.93]);ctx.beginPath();ctx.moveTo(a[0],a[1]);ctx.lineTo(b[0],b[1]);ctx.stroke();}

// ---------- subtitles ----------
let CHUNKS=[];
function buildChunks(){
  const ws=WORDS; let cur=[];
  const flush=()=>{if(cur.length)CHUNKS.push(cur);cur=[];};
  for(let i=0;i<ws.length;i++){
    const w=ws[i]; const prev=cur[cur.length-1];
    if(prev&&(w[1]-prev[2]>0.45||/[.,?:!]$/.test(prev[0])||cur.length>=4||(cur.length>=3&&w[0].length>8))) flush();
    cur.push(w);
  }
  flush();
  CHUNKS.forEach((c,i)=>{c.start=c[0][1]-0.05;const next=CHUNKS[i+1];c.end=next?Math.min(next[0][1]-0.05,c[c.length-1][2]+0.9):c[c.length-1][2]+1.2;});
}
function subtitles(t){
  const ch=CHUNKS.find(c=>t>=c.start&&t<c.end); if(!ch)return;
  const size=70, font=F(900,size), gap=20, maxW=980;
  const words=ch.map(w=>w[0].toUpperCase());
  // layout lines
  const lines=[[]];let lw=0;
  words.forEach((w,i)=>{const ww=tw(w,font);if(lw+ww>maxW&&lines[lines.length-1].length){lines.push([]);lw=0;}lines[lines.length-1].push(i);lw+=ww+gap;});
  const lh=size*1.18; const y0=300-(lines.length-1)*lh/2;
  lines.forEach((ln,li)=>{
    const total=ln.reduce((s,i)=>s+tw(words[i],font),0)+gap*(ln.length-1);
    let x=W/2-total/2; const y=y0+li*lh;
    ln.forEach(i=>{
      const w=ch[i]; const ww=tw(words[i],font);
      if(t>=w[1]-0.04){
        const pop=eBack(P(t,w[1]-0.04,w[1]+0.14)); const active=t<(ch[i+1]?ch[i+1][1]:ch.end)-0.04 && t>=w[1]-0.04;
        ctx.save();ctx.translate(x+ww/2,y-size*0.35);ctx.scale(0.7+0.3*pop,0.7+0.3*pop);ctx.translate(-(x+ww/2),-(y-size*0.35));
        if(active){ctx.fillStyle=RED;rr(x-12,y-size*0.86,ww+24,size*1.08,12);ctx.fill();}
        ctx.lineJoin='round';ctx.font=font;ctx.textAlign='left';ctx.textBaseline='alphabetic';
        if(!active){ctx.lineWidth=12;ctx.strokeStyle='rgba(4,11,28,0.95)';ctx.strokeText(words[i],x,y);}
        ctx.shadowColor='rgba(0,0,0,0.6)';ctx.shadowBlur=14;ctx.fillStyle=WHITE;ctx.fillText(words[i],x,y);
        ctx.restore();

// transition wipe across each cut
function wipe(t){
  for(const c of CUTS){
    if(c===S.s4) continue; // s3->s4 handled by hard cut
    const d=0.2; if(t<c-d||t>c+d) continue;
    const u=(t-(c-d))/(2*d); // 0..1
    const x=lerp(-W*1.4,W*1.4,eIO(u));
    ctx.save();ctx.translate(x,0);ctx.transform(1,0,-0.25,1,0,0);
    ctx.fillStyle=NAVY2;ctx.fillRect(-W*0.1,0,W*1.2+500,H);ctx.fillStyle=RED;ctx.fillRect(-W*0.1-40,0,40,H);ctx.fillRect(W*1.1+500,0,40,H);
    ctx.restore();
  }
}

function render(t){
  ctx.save();
  ctx.clearRect(0,0,W,H);
  if(t<S.s2) scene1(t);
  else if(t<S.s3) scene2(t);
  else if(t<S.s4) scene3(t);
  else if(t<S.s5) scene4(t);
  else if(t<S.s6) scene5(t);
  else if(t<S.s7) scene6(t);
  else if(t<S.s8) scene7(t);
  else if(t<S.s9) scene8(t);
  else if(t<S.s10) scene9(t);
  else if(t<S.s11) scene10(t);
  else scene11(t);
  vignetteAndGrain(Math.floor(t*FPS));
  if(t<S.s11) brandBug(1);
  wipe(t);
  subtitles(t);
  // fade in
  if(t<0.3){ctx.fillStyle=`rgba(0,0,0,${1-t/0.3})`;ctx.fillRect(0,0,W,H);}
  ctx.restore();
}
window.render=render;
window.DURATION=DURATION;window.CUTS=CUTS;window.S=S;
window.ready=Promise.all(IMG_NAMES.map(loadImg)).then(()=>document.fonts.load(F(900,40))).then(()=>document.fonts.load(F(600,40))).then(()=>document.fonts.load(F(800,40))).then(()=>{makeGrain();buildChunks();render(0);return true;});
