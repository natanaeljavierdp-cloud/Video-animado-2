<!doctype html>
<html><head><meta charset="utf-8"><title>Capital Curioso — Latinos</title>
<style>html,body{margin:0;background:#000}canvas{display:block;width:540px;height:960px}</style>
</head><body>
<canvas id="c" width="1080" height="1920"></canvas>
<script>
// =====================================================================
//  Capital Curioso — "1 de cada 5" — motor de animación por fotograma
//  renderFrame(t) dibuja el instante t (segundos) de forma determinista.
// =====================================================================
const W = 1080, H = 1920;
const C = {
  navy: '#0A285A', navyD: '#061936', navyL: '#163C7A', blue: '#1E57B8',
  red: '#FF4A55', redD: '#D8303C', white: '#FFFFFF', grey: '#9FB0CC', ink: '#0A1D3F'
};
// Escenas sincronizadas con la narración (segundos)
const SC = [
  { id: 'cifra',     a: 0.00,  b: 5.00 },
  { id: 'mapa',      a: 5.00,  b: 9.45 },
  { id: 'nacidos',   a: 9.45,  b: 16.25 },
  { id: 'votantes',  a: 16.25, b: 27.05 },
  { id: 'capitolio', a: 27.05, b: 37.20 },
  { id: 'encuesta',  a: 37.20, b: 47.25 },
  { id: 'split',     a: 47.25, b: 50.15 },
  { id: 'final',     a: 50.15, b: 58.50 },
];
const TR = 0.40; // duración de transición

const cv = document.getElementById('c');
const ctx = cv.getContext('2d');

// ---------- utilidades ----------
const clamp = (v, a = 0, b = 1) => Math.max(a, Math.min(b, v));
const lerp = (a, b, k) => a + (b - a) * k;
const P = (t, a, b) => clamp((t - a) / (b - a));
const eOut = k => 1 - Math.pow(1 - k, 3);
const eOut5 = k => 1 - Math.pow(1 - k, 5);
const eIO = k => k < .5 ? 4 * k * k * k : 1 - Math.pow(-2 * k + 2, 3) / 2;
const eBack = k => { const c1 = 1.9, c3 = c1 + 1; return k <= 0 ? 0 : 1 + c3 * Math.pow(k - 1, 3) + c1 * Math.pow(k - 1, 2); };
function rand(seed) { let s = seed >>> 0; return () => { s = (s * 1664525 + 1013904223) >>> 0; return s / 4294967296; }; }

function font(size, fam = 'Poppins', w = 800) { return fam === 'Anton' ? `${size}px Anton` : `${w} ${size}px Poppins, "Noto Color Emoji"`; }

function rr(x, y, w, h, r) { ctx.beginPath(); ctx.roundRect(x, y, w, h, r); }

// Texto con ajuste de ancho automático
function fitText(str, x, y, { size = 100, fam = 'Anton', w = 800, color = C.white, max = 980, align = 'center', alpha = 1, ls = 0, shadow = true, base = 'middle' } = {}) {
  ctx.save();
  ctx.globalAlpha *= alpha;
  ctx.letterSpacing = ls + 'px';
  ctx.font = font(size, fam, w);
  let m = ctx.measureText(str).width;
  if (m > max) { size = size * max / m; ctx.font = font(size, fam, w); m = ctx.measureText(str).width; }
  ctx.textAlign = align; ctx.textBaseline = base; ctx.fillStyle = color;
  if (shadow) { ctx.shadowColor = 'rgba(0,0,0,.45)'; ctx.shadowBlur = 24; ctx.shadowOffsetY = 6; }
  ctx.fillText(str, x, y);
  ctx.restore();
  return { w: m, size };
}

// Titular de líneas con revelado por máscara (sube desde abajo)
// lines: [{t:'TEXTO', c:color, s:size}]
function headline(lines, cx, y, t0, t, { gap = 12, max = 980, stagger = 0.12, dur = 0.5, alpha = 1 } = {}) {
  let yy = y;
  lines.forEach((L, i) => {
    const k = eOut5(P(t, t0 + i * stagger, t0 + i * stagger + dur));
    const s = L.s || 100;
    ctx.save();
    ctx.font = font(s, 'Anton');
    let m = ctx.measureText(L.t).width, sz = s;
    if (m > max) sz = s * max / m;
    const h = sz * 1.18;
    ctx.beginPath(); ctx.rect(0, yy - 6, W, h + 12); ctx.clip();
    ctx.translate(0, (1 - k) * h);
    fitText(L.t, cx, yy + h / 2 + 2, { size: s, color: L.c || C.white, max, alpha: alpha * k, ls: 1 });
    ctx.restore();
    yy += h + gap;
  });
  return yy;
}

// Tarjeta de fuente
function sourceCard(label, x, y, t0, t, { w = null, alpha = 1 } = {}) {
  const k = eOut5(P(t, t0, t0 + 0.55));
  if (k <= 0) return;
  ctx.save();
  ctx.globalAlpha *= alpha * k;
  ctx.font = font(34, 'Poppins', 700);
  const tw = ctx.measureText(label).width;
  const cw = w || Math.min(980, tw + 210);
  const cx = x - cw / 2 + (1 - k) * -60;
  // tarjeta
  ctx.shadowColor = 'rgba(0,0,0,.35)'; ctx.shadowBlur = 30; ctx.shadowOffsetY = 10;
  ctx.fillStyle = 'rgba(6,25,54,.88)'; rr(cx, y, cw, 104, 22); ctx.fill();
  ctx.shadowColor = 'transparent';
  ctx.strokeStyle = 'rgba(255,255,255,.14)'; ctx.lineWidth = 2; rr(cx, y, cw, 104, 22); ctx.stroke();
  ctx.fillStyle = C.red; rr(cx, y, 12, 104, [22, 0, 0, 22]); ctx.fill();
  // ícono de comillas
  ctx.fillStyle = C.red; ctx.font = font(84, 'Poppins', 900); ctx.textBaseline = 'middle'; ctx.textAlign = 'left';
  ctx.fillText('“', cx + 34, y + 72);
  ctx.fillStyle = C.grey; ctx.font = font(22, 'Poppins', 700); ctx.letterSpacing = '4px';
  ctx.fillText('FUENTE', cx + 104, y + 32);
  ctx.letterSpacing = '0px';
  ctx.fillStyle = C.white; ctx.font = font(34, 'Poppins', 700);
  let fs = 34; while (ctx.measureText(label).width > cw - 140 && fs > 20) { fs -= 1; ctx.font = font(fs, 'Poppins', 700); }
  ctx.fillText(label, cx + 104, y + 70);
  ctx.restore();
}

// Fondo azul marino con cuadrícula de datos y partículas
function navyBG(t, { dark = 0 } = {}) {
  const g = ctx.createRadialGradient(W / 2, H * 0.42, 100, W / 2, H * 0.45, 1250);
  g.addColorStop(0, dark ? '#0B2350' : '#123874'); g.addColorStop(0.55, dark ? '#061632' : C.navy); g.addColorStop(1, '#040F24');
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  ctx.save();
  ctx.strokeStyle = 'rgba(255,255,255,.045)'; ctx.lineWidth = 2;
  const off = (t * 18) % 90;
  ctx.beginPath();
  for (let x = -90 + off; x < W + 90; x += 90) { ctx.moveTo(x, 0); ctx.lineTo(x, H); }
  for (let y = -90 + off; y < H + 90; y += 90) { ctx.moveTo(0, y); ctx.lineTo(W, y); }
  ctx.stroke();
  const r = rand(7);
  for (let i = 0; i < 46; i++) {
    const px = r() * W, py0 = r() * H, sp = 10 + r() * 30, sz = 1.5 + r() * 3.5;
    const py = (py0 - t * sp + H * 10) % H;
    ctx.globalAlpha = 0.12 + 0.25 * r();
    ctx.fillStyle = r() < 0.25 ? C.red : '#fff';
    ctx.beginPath(); ctx.arc(px, py, sz, 0, Math.PI * 2); ctx.fill();
  }
  ctx.restore();
}

// Foto en modo "cover" con zoom tipo Ken Burns
function photo(img, { x = 0, y = 0, w = W, h = H, zoom = 1, fx = 0.5, fy = 0.5, dx = 0, dy = 0, alpha = 1 } = {}) {
  const s = Math.max(w / img.width, h / img.height) * zoom;
  const iw = img.width * s, ih = img.height * s;
  const ox = x + (w - iw) * fx + dx, oy = y + (h - ih) * fy + dy;
  ctx.save(); ctx.globalAlpha *= alpha;
  ctx.beginPath(); ctx.rect(x, y, w, h); ctx.clip();
  ctx.drawImage(img, ox, oy, iw, ih);
  ctx.restore();
}

function vignette(str = 0.55) {
  const g = ctx.createRadialGradient(W / 2, H / 2, H * 0.28, W / 2, H / 2, H * 0.75);
  g.addColorStop(0, 'rgba(0,0,0,0)'); g.addColorStop(1, `rgba(0,0,0,${str})`);
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
}

// ---------- íconos ilustrados ----------
function person(cx, cy, s, color) {
  ctx.fillStyle = color;
  ctx.beginPath(); ctx.arc(cx, cy - 92 * s, 46 * s, 0, Math.PI * 2); ctx.fill();
  ctx.beginPath();
  ctx.moveTo(cx - 78 * s, cy + 120 * s);
  ctx.lineTo(cx - 78 * s, cy + 10 * s);
  ctx.quadraticCurveTo(cx - 78 * s, cy - 32 * s, cx - 36 * s, cy - 32 * s);
  ctx.lineTo(cx + 36 * s, cy - 32 * s);
  ctx.quadraticCurveTo(cx + 78 * s, cy - 32 * s, cx + 78 * s, cy + 10 * s);
  ctx.lineTo(cx + 78 * s, cy + 120 * s);
  ctx.closePath(); ctx.fill();
}

function badge(cx, cy, r, k, fill = C.red) {
  ctx.save();
  ctx.translate(cx, cy); ctx.scale(k, k);
  ctx.shadowColor = 'rgba(0,0,0,.4)'; ctx.shadowBlur = 40; ctx.shadowOffsetY = 12;
  ctx.fillStyle = fill; ctx.beginPath(); ctx.arc(0, 0, r, 0, Math.PI * 2); ctx.fill();
  ctx.shadowColor = 'transparent';
  ctx.strokeStyle = 'rgba(255,255,255,.9)'; ctx.lineWidth = 8; ctx.beginPath(); ctx.arc(0, 0, r - 14, 0, Math.PI * 2); ctx.stroke();
  ctx.restore();
}

function iconHospitalBaby(cx, cy, k, t) {
  badge(cx, cy, 130, k);
  ctx.save(); ctx.translate(cx, cy); ctx.scale(k, k);
  // edificio
  ctx.fillStyle = '#fff';
  rr(-62, -40, 124, 100, 10); ctx.fill();
  ctx.beginPath(); ctx.moveTo(-74, -36); ctx.lineTo(0, -82); ctx.lineTo(74, -36); ctx.closePath(); ctx.fill();
  // cruz
  ctx.fillStyle = C.red;
  ctx.fillRect(-9, -30, 18, 50); ctx.fillRect(-25, -14, 50, 18);
  // bebé envuelto
  const bob = Math.sin(t * 4) * 3;
  ctx.translate(0, 58 + bob);
  ctx.fillStyle = C.navy; rr(-40, -16, 80, 40, 20); ctx.fill();
  ctx.fillStyle = '#FFD7B5'; ctx.beginPath(); ctx.arc(-34, 2, 17, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(14, 4, 6, 0, Math.PI * 2); ctx.fill();
  ctx.restore();
}

function iconBallot(cx, cy, k, t) {
  badge(cx, cy, 110, k);
  ctx.save(); ctx.translate(cx, cy); ctx.scale(k, k);
  // papeleta entrando
  const drop = (t % 1.6) / 1.6, dk = eIO(clamp(drop * 1.6));
  ctx.save();
  ctx.beginPath(); ctx.rect(-80, -120, 160, 112); ctx.clip();
  ctx.fillStyle = '#fff'; ctx.translate(0, lerp(-60, 10, dk));
  rr(-26, -60, 52, 66, 6); ctx.fill();
  ctx.strokeStyle = C.red; ctx.lineWidth = 7; ctx.lineCap = 'round';
  ctx.beginPath(); ctx.moveTo(-12, -28); ctx.lineTo(-2, -18); ctx.lineTo(14, -40); ctx.stroke();
  ctx.restore();
  // urna
  ctx.fillStyle = '#fff'; rr(-62, -8, 124, 76, 10); ctx.fill();
  ctx.fillStyle = C.navy; rr(-36, -14, 72, 12, 6); ctx.fill();
  ctx.fillStyle = C.red; ctx.font = font(26, 'Poppins', 800); ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillText('VOTO', 0, 32);
  ctx.restore();
}

function iconCapitol(x, y, s, color) {
  ctx.save(); ctx.translate(x, y); ctx.scale(s, s); ctx.fillStyle = color;
  ctx.fillRect(-4, -78, 8, 18);
  ctx.beginPath(); ctx.arc(0, -30, 30, Math.PI, 0); ctx.fill();
  ctx.fillRect(-36, -32, 72, 8);
  ctx.fillRect(-60, -18, 120, 8);
  for (let i = -3; i <= 3; i++) ctx.fillRect(i * 17 - 4, -8, 8, 34);
  ctx.fillRect(-66, 28, 132, 10);
  ctx.restore();
}

function iconPoll(x, y, s, color) {
  ctx.save(); ctx.translate(x, y); ctx.scale(s, s); ctx.fillStyle = color;
  rr(-30, -30, 60, 60, 10); ctx.fill();
  ctx.fillStyle = '#fff';
  rr(-18, 4, 9, 16, 2); ctx.fill(); rr(-4, -10, 9, 30, 2); ctx.fill(); rr(10, -18, 9, 38, 2); ctx.fill();
  ctx.restore();
}

function arrowUp(cx, cy, s, color) {
  ctx.save(); ctx.translate(cx, cy); ctx.scale(s, s); ctx.fillStyle = color;
  ctx.beginPath();
  ctx.moveTo(0, -100); ctx.lineTo(80, -10); ctx.lineTo(30, -10); ctx.lineTo(30, 90);
  ctx.lineTo(-30, 90); ctx.lineTo(-30, -10); ctx.lineTo(-80, -10); ctx.closePath(); ctx.fill();
  ctx.restore();
}

function commentIcon(cx, cy, s, t) {
  ctx.save(); ctx.translate(cx, cy); ctx.scale(s, s);
  ctx.shadowColor = 'rgba(0,0,0,.35)'; ctx.shadowBlur = 30; ctx.shadowOffsetY = 10;
  ctx.fillStyle = '#fff';
  ctx.beginPath(); ctx.roundRect(-110, -78, 220, 140, 46); ctx.fill();
  ctx.beginPath(); ctx.moveTo(-50, 50); ctx.lineTo(-74, 104); ctx.lineTo(0, 56); ctx.closePath(); ctx.fill();
  ctx.shadowColor = 'transparent';
  for (let i = -1; i <= 1; i++) {
    const b = Math.max(0, Math.sin(t * 7 - i * 0.9)) * 10;
    ctx.fillStyle = i === 0 ? C.red : C.navy;
    ctx.beginPath(); ctx.arc(i * 52, -8 - b, 16, 0, Math.PI * 2); ctx.fill();
  }
  ctx.restore();
}

function logoMark(cx, cy, s, k = 1) {
  ctx.save(); ctx.translate(cx, cy); ctx.scale(s, s);
  ctx.strokeStyle = '#fff'; ctx.lineWidth = 12; ctx.lineCap = 'round';
  ctx.beginPath(); ctx.arc(0, 0, 40, -Math.PI / 2, -Math.PI / 2 + Math.PI * 2 * k); ctx.stroke();
  ctx.strokeStyle = C.red; ctx.lineWidth = 14;
  ctx.beginPath(); ctx.moveTo(30, 30); ctx.lineTo(56, 56); ctx.stroke();
  ctx.fillStyle = C.red; ctx.font = font(46, 'Poppins', 900); ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillText('?', 0, 3);
  ctx.restore();
}

// ---------- recursos ----------
const IMG = {};
let STATES = [], WORDS = [], CHUNKS = [];
const off = {};
function mkCanvas(w, h) { const c = document.createElement('canvas'); c.width = w; c.height = h; return c; }

function prepImage(img, { blur = 0, sat = 1, bright = 1, maxW = 1400 } = {}) {
  const s = Math.min(1, maxW / img.width);
  const c = mkCanvas(Math.round(img.width * s), Math.round(img.height * s));
  const x = c.getContext('2d');
  x.filter = `blur(${blur}px) saturate(${sat}) brightness(${bright})`;
  x.drawImage(img, 0, 0, c.width, c.height);
  return c;
}

async function load() {
  const fonts = [['Poppins', 'poppins-latin-600-normal', '600'], ['Poppins', 'poppins-latin-700-normal', '700'],
  ['Poppins', 'poppins-latin-800-normal', '800'], ['Poppins', 'poppins-latin-900-normal', '900'], ['Anton', 'anton-latin-400-normal', '400']];
  for (const [f, file, w] of fonts) { const ff = new FontFace(f, `url(assets/fonts/${file}.woff2)`, { weight: w }); await ff.load(); document.fonts.add(ff); }
  await document.fonts.load('48px "Noto Color Emoji"', '👍👎');
  const names = ['bailarinas', 'abuelo', 'familia', 'capitolio_cupula', 'capitolio', 'madre_hija'];
  await Promise.all(names.map(n => new Promise((res, rej) => { const i = new Image(); i.onload = () => { IMG[n] = i; res(); }; i.onerror = rej; i.src = `assets/fotos/${n}.jpg`; })));
  STATES = await (await fetch('assets/us-states.json')).json();
  STATES.forEach(s => s.p = new Path2D(s.d));
  const r = rand(11);
  STATES.forEach(s => s.ord = s.cx / 975 * 0.75 + r() * 0.25);
  WORDS = await (await fetch('assets/words.json')).json();
  buildChunks();
  // variantes procesadas de las fotos
  off.madre = prepImage(IMG.madre_hija, { blur: 2, sat: 0.8, bright: 0.9 });
  off.abuelo = prepImage(IMG.abuelo, { blur: 1.5, sat: 0.15, bright: 0.8 });
  off.bail = prepImage(IMG.bailarinas, { blur: 14, sat: 1.1, bright: 0.9, maxW: 900 });
  // grano
  off.grain = [];
  for (let g = 0; g < 4; g++) {
    const c = mkCanvas(540, 960), x = c.getContext('2d'), d = x.createImageData(540, 960), rg = rand(100 + g);
    for (let i = 0; i < d.data.length; i += 4) { const v = rg() * 255; d.data[i] = d.data[i + 1] = d.data[i + 2] = v; d.data[i + 3] = 255; }
    x.putImageData(d, 0, 0); off.grain.push(c);
  }
  window.READY = true;
}

// ---------- subtítulos palabra por palabra ----------
function clean(w) { return w.replace(/[.,]/g, '').toUpperCase(); }
function buildChunks() {
  let cur = [];
  const push = () => { if (cur.length) CHUNKS.push(cur); cur = []; };
  WORDS.forEach((w, i) => {
    const prev = cur[cur.length - 1];
    if (prev && (w[1] - prev[2] > 0.3)) push();
    cur.push(w);
    const len = cur.map(x => x[0]).join(' ').length;
    if (/[.?!,]$/.test(w[0]) || cur.length >= 3 || len > 16) push();
  });
  push();
  // ventanas de visibilidad
  CHUNKS.forEach((c, i) => {
    c.a = c[0][1] - 0.06;
    const next = CHUNKS[i + 1];
    c.b = next ? Math.min(next[0][1] - 0.06, c[c.length - 1][2] + 0.7) : c[c.length - 1][2] + 0.5;
  });
}
function subtitles(t) {
  const ch = CHUNKS.find(c => t >= c.a && t < c.b);
  if (!ch) return;
  const Y = 300, size = 74;
  ctx.save();
  ctx.font = font(size, 'Poppins', 900);
  ctx.letterSpacing = '0px';
  const words = ch.map(w => clean(w[0]));
  const sp = 22;
  const ws = words.map(w => ctx.measureText(w).width);
  let total = ws.reduce((a, b) => a + b, 0) + sp * (words.length - 1);
  const sc = Math.min(1, 980 / total);
  ctx.translate(W / 2, Y); ctx.scale(sc, sc);
  let x = -total / 2;
  ch.forEach((w, i) => {
    const k = P(t, w[1] - 0.05, w[1] + 0.1);
    if (k > 0) {
      const next = ch[i + 1];
      const active = t >= w[1] - 0.05 && (!next || t < next[1] - 0.05) && t < w[2] + 0.25;
      const pop = eBack(k);
      ctx.save();
      ctx.translate(x + ws[i] / 2, 0); ctx.scale(0.7 + 0.3 * pop, 0.7 + 0.3 * pop);
      ctx.globalAlpha = clamp(k * 2);
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      if (active) {
        ctx.fillStyle = C.red;
        rr(-ws[i] / 2 - 14, -size * 0.62, ws[i] + 28, size * 1.2, 16); ctx.fill();
      }
      ctx.lineJoin = 'round'; ctx.lineWidth = 14; ctx.strokeStyle = 'rgba(4,15,36,.85)';
      if (!active) ctx.strokeText(words[i], 0, 4);
      ctx.fillStyle = '#fff';
      ctx.shadowColor = 'rgba(0,0,0,.5)'; ctx.shadowBlur = 16; ctx.shadowOffsetY = 5;
      ctx.fillText(words[i], 0, 4);
      ctx.restore();
    }
    x += ws[i] + sp;
  });
  ctx.restore();
}

// Distintivo de marca (arriba a la izquierda)
function brandBug(alpha = 1) {
  ctx.save(); ctx.globalAlpha = 0.9 * alpha;
  logoMark(86, 118, 0.48);
  ctx.font = font(26, 'Poppins', 800); ctx.textBaseline = 'middle'; ctx.textAlign = 'left'; ctx.letterSpacing = '2px';
  ctx.shadowColor = 'rgba(0,0,0,.5)'; ctx.shadowBlur = 10;
  ctx.fillStyle = '#fff'; ctx.fillText('CAPITAL', 128, 104);
  ctx.fillStyle = C.red; ctx.fillText('CURIOSO', 128, 134);
  ctx.restore();
}

// ---------- ESCENAS (t = tiempo global) ----------
const S = {};

// 0–5 s · 1 de cada 5
S.cifra = (t) => {
  navyBG(t);
  ctx.save();
  const push = 1 + t * 0.012; ctx.translate(W / 2, H / 2); ctx.scale(push, push); ctx.translate(-W / 2, -H / 2);
  const cy = 860, gap = 196;
  for (let i = 0; i < 5; i++) {
    const k = eBack(P(t, 0.05 + i * 0.13, 0.45 + i * 0.13));
    if (k <= 0) continue;
    const x = W / 2 + (i - 2) * gap;
    const hi = i === 2;
    const lit = hi ? eOut(P(t, 0.8, 1.05)) : 0;
    ctx.save(); ctx.translate(x, cy + (1 - k) * 80); ctx.globalAlpha = clamp(k);
    if (lit > 0) {
      const g = ctx.createRadialGradient(0, 0, 10, 0, 0, 230);
      g.addColorStop(0, `rgba(255,74,85,${0.55 * lit})`); g.addColorStop(1, 'rgba(255,74,85,0)');
      ctx.fillStyle = g; ctx.fillRect(-240, -260, 480, 520);
    }
    const sc = 1 + 0.12 * lit;
    ctx.scale(sc, sc);
    person(0, 0, 0.95, lit > 0 ? `rgb(${lerp(70, 255, lit)},${lerp(100, 74, lit)},${lerp(160, 85, lit)})` : '#46649F');
    ctx.restore();
  }
  // número gigante
  const k = P(t, 0.8, 1.15);
  if (k > 0) {
    const s = lerp(1.7, 1, eOut5(k));
    ctx.save(); ctx.translate(W / 2, 1270); ctx.scale(s, s);
    ctx.globalAlpha = clamp(k * 3);
    fitText('1 DE CADA 5', 0, 0, { size: 230, color: '#fff', max: 930, ls: 2 });
    ctx.restore();
    // subrayado rojo
    const u = eOut5(P(t, 1.1, 1.6));
    ctx.fillStyle = C.red; ctx.fillRect(W / 2 - 360 * u, 1410, 720 * u, 14);
  }
  headline([{ t: 'LA CIFRA QUE ESTÁ', s: 74, c: '#fff' }, { t: 'CAMBIANDO A EE. UU.', s: 74, c: C.red }], W / 2, 1470, 2.4, t, { max: 900 });
  // flash del golpe
  const f = 1 - P(t, 0.8, 1.1);
  if (t > 0.8 && f > 0) { ctx.fillStyle = `rgba(255,255,255,${0.25 * f})`; ctx.fillRect(0, 0, W, H); }
  ctx.restore();
};

// 5–9.45 s · Mapa 20 %
S.mapa = (t) => {
  navyBG(t);
  const lt = t - 5;
  // contador
  const ck = eOut(P(t, 6.45, 7.45));
  const n = Math.round(20 * ck);
