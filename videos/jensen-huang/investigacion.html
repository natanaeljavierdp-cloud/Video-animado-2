<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Capital Curioso · Investigación</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  html,body{margin:0;background:#030B1A;color:#fff;font-family:system-ui,sans-serif}
  body.preview{display:flex;flex-direction:column;align-items:center;gap:10px;padding:12px}
  canvas{display:block}
  body.preview canvas{height:min(82vh,1920px);width:auto;box-shadow:0 10px 40px #0008}
  #ctrl{display:none;gap:10px;align-items:center;width:min(92vw,520px)}
  body.preview #ctrl{display:flex}
  #ctrl input{flex:1}
  #ctrl button{background:#FE4A55;color:#fff;border:0;border-radius:6px;padding:6px 12px;font-weight:700;cursor:pointer}
</style>
</head>
<body>
<canvas id="c" width="1080" height="1920"></canvas>
<div id="ctrl"><button id="play">▶︎</button><input id="scrub" type="range" min="0" max="66.5" step="0.0333" value="0"><span id="tc">0.0 s</span></div>
<script src="fotos.js"></script>
<script src="narracion.js"></script>
<script>
/* =====================================================================
   CAPITAL CURIOSO · formato "INVESTIGACIÓN" · 1080x1920 · 30 fps
   Misma narración y tiempos que el noticiero (narracion.js), con estética
   de expediente: tablero de evidencias, fichas de sujeto, papel, sellos,
   máquina de escribir, grano de película y fotos con movimiento de cámara.
   ===================================================================== */
const P = {
  bg0: '#071833', bg1: '#030B1A', navy: '#0A285A', red: '#FE4A55', redD: '#C92A36', string: '#E3343F',
  paper: '#EFE7D6', paper2: '#E4D9C2', ink: '#1C2333', inkSoft: '#5A5F6E', marker: 'rgba(255,214,64,.62)',
  white: '#FFFFFF', gray: '#A9B8D3', gold: '#FFC83D'
};
const TYPE = 'Courier Prime', STAMPF = 'Special Elite';
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
const F = (w, px, fam = 'Poppins') => `${w} ${px}px "${fam}"`;

// ---------------------------------------------------------------- utilidades de dibujo
function rr(x, y, w, h, r) { ctx.beginPath(); ctx.roundRect(x, y, w, h, r); }
function txt(s, x, y, font, color, align = 'left', base = 'alphabetic') { ctx.font = font; ctx.fillStyle = color; ctx.textAlign = align; ctx.textBaseline = base; ctx.fillText(s, x, y); }
function wrap(s, maxW, font) { ctx.font = font; const out = []; let line = ''; for (const w of s.split(' ')) { const tst = line ? line + ' ' + w : w; if (ctx.measureText(tst).width > maxW && line) { out.push(line); line = w; } else line = tst; } if (line) out.push(line); return out; }
function withAlpha(a, fn) { if (a <= 0) return; ctx.save(); ctx.globalAlpha *= clamp(a); fn(); ctx.restore(); }
function shadow(blur = 30, col = '#000a', oy = 10) { ctx.shadowColor = col; ctx.shadowBlur = blur; ctx.shadowOffsetY = oy; }
function noShadow() { ctx.shadowColor = 'transparent'; ctx.shadowBlur = 0; ctx.shadowOffsetY = 0; }
function rng(seed) { let a = seed >>> 0; return () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const off = (w, h) => { const c = document.createElement('canvas'); c.width = w; c.height = h; return c; };

// ---------------------------------------------------------------- texturas (se crean una vez)
let GRAIN, PAPER;
function makeTextures() {
  const r = rng(7);
  GRAIN = off(512, 512); const g = GRAIN.getContext('2d'), id = g.createImageData(512, 512);
  for (let i = 0; i < id.data.length; i += 4) { const v = r() * 255; id.data[i] = id.data[i + 1] = id.data[i + 2] = v; id.data[i + 3] = 255; }
  g.putImageData(id, 0, 0);
  PAPER = off(1024, 1024); const p = PAPER.getContext('2d');
  p.fillStyle = P.paper; p.fillRect(0, 0, 1024, 1024);
  for (let i = 0; i < 9000; i++) { p.fillStyle = `rgba(120,95,60,${r() * .05})`; p.fillRect(r() * 1024, r() * 1024, 1 + r() * 3, 1 + r() * 3); }
  for (let i = 0; i < 40; i++) { const x = r() * 1024, y = r() * 1024, rad = 30 + r() * 140; const gr = p.createRadialGradient(x, y, 0, x, y, rad); gr.addColorStop(0, `rgba(150,110,60,${r() * .06})`); gr.addColorStop(1, 'rgba(150,110,60,0)'); p.fillStyle = gr; p.fillRect(x - rad, y - rad, rad * 2, rad * 2); }
}
function paper(x, y, w, h, rot = 0, opt = {}) {
  ctx.save(); ctx.translate(x + w / 2, y + h / 2); ctx.rotate(rot); ctx.translate(-w / 2, -h / 2);
  shadow(opt.sh ?? 36, '#000c', 14);
  ctx.fillStyle = ctx.createPattern(PAPER, 'repeat'); ctx.fillRect(0, 0, w, h); noShadow();
  const eg = ctx.createLinearGradient(0, 0, 0, h); eg.addColorStop(0, 'rgba(0,0,0,0)'); eg.addColorStop(1, 'rgba(90,60,20,.10)'); ctx.fillStyle = eg; ctx.fillRect(0, 0, w, h);
  if (opt.lines) { ctx.strokeStyle = 'rgba(40,80,160,.10)'; ctx.lineWidth = 2; for (let yy = opt.lines; yy < h; yy += opt.lines) { ctx.beginPath(); ctx.moveTo(0, yy); ctx.lineTo(w, yy); ctx.stroke(); } }
  if (opt.fn) opt.fn(w, h);
  ctx.restore();
}
function pin(x, y, col = P.red) {
  ctx.save(); shadow(8, '#0009', 4);
  const g = ctx.createRadialGradient(x - 4, y - 5, 2, x, y, 15); g.addColorStop(0, '#ff9aa1'); g.addColorStop(1, col);
  ctx.fillStyle = g; ctx.beginPath(); ctx.arc(x, y, 14, 0, 7); ctx.fill(); ctx.restore();
}
function clip(x, y, rot = 0) { // clip de papel
  ctx.save(); ctx.translate(x, y); ctx.rotate(rot); ctx.strokeStyle = '#B8C0CC'; ctx.lineWidth = 6; ctx.lineCap = 'round';
  ctx.beginPath(); ctx.moveTo(0, 60); ctx.lineTo(0, -10); ctx.arc(14, -10, 14, Math.PI, 0); ctx.lineTo(28, 50); ctx.arc(18, 50, 10, 0, Math.PI); ctx.lineTo(8, 0); ctx.stroke(); ctx.restore();
}
const STAMPS = {};
function stamp(key, lines, cx, cy, rot, s, a = 1, col = P.red) {
  if (s <= 0 || a <= 0) return;
  if (!STAMPS[key]) {
    const fs = 64; const m = off(10, 10).getContext('2d'); m.font = `${fs}px "${STAMPF}"`;
    const w = Math.max(...lines.map(l => m.measureText(l).width)) + 90, h = lines.length * fs * 1.08 + 60;
    const c = off(w, h), g = c.getContext('2d');
    g.strokeStyle = col; g.fillStyle = col; g.lineWidth = 9; g.beginPath(); g.roundRect(6, 6, w - 12, h - 12, 12); g.stroke();
    g.lineWidth = 3; g.beginPath(); g.roundRect(20, 20, w - 40, h - 40, 8); g.stroke();
    g.font = `${fs}px "${STAMPF}"`; g.textAlign = 'center'; g.textBaseline = 'middle';
    lines.forEach((l, i) => g.fillText(l, w / 2, h / 2 + (i - (lines.length - 1) / 2) * fs * 1.08 + 4));
    const r = rng(key.length * 97); g.globalCompositeOperation = 'destination-out';
    for (let i = 0; i < 900; i++) { g.globalAlpha = .3 + r() * .7; g.beginPath(); g.arc(r() * w, r() * h, r() * 2.6, 0, 7); g.fill(); }
    STAMPS[key] = c;
  }
  const c = STAMPS[key];
  ctx.save(); ctx.translate(cx, cy); ctx.rotate(rot); ctx.scale(s, s); ctx.globalAlpha *= a * .92; ctx.drawImage(c, -c.width / 2, -c.height / 2); ctx.restore();
}
function typed(str, k) { return str.slice(0, Math.floor(str.length * clamp(k))); }
function cursorAt(x, y, h, t, col = P.red) { if (Math.floor(t * 4) % 2 === 0) { ctx.fillStyle = col; ctx.fillRect(x + 4, y - h * .8, 4, h); } }
function magnifier(cx, cy, r) {
  ctx.save(); ctx.lineCap = 'round';
  ctx.strokeStyle = P.red; ctx.lineWidth = r * .32; ctx.beginPath(); ctx.moveTo(cx + r * .78, cy + r * .78); ctx.lineTo(cx + r * 1.45, cy + r * 1.45); ctx.stroke();
  ctx.strokeStyle = P.white; ctx.lineWidth = r * .26; ctx.beginPath(); ctx.arc(cx, cy, r, 0, Math.PI * 2); ctx.stroke();
  txt('?', cx, cy + r * .05, F(900, r * 1.25), P.red, 'center', 'middle'); ctx.restore();
}

// ---------------------------------------------------------------- FOTOS con movimiento de cámara
const IMG = {}, BLUR = {};
async function loadPhotos() {
  await Promise.all(Object.entries(window.FOTOS || {}).map(([k, url]) => new Promise(res => {
    const im = new Image(); im.onload = () => {
      IMG[k] = im;
      const bw = 160, bh = Math.round(160 * im.height / im.width), c = off(bw, bh), g = c.getContext('2d');
      g.filter = 'blur(5px)'; g.drawImage(im, -10, -10, bw + 20, bh + 20); BLUR[k] = c; res();
    }; im.onerror = res; im.src = url;
  })));
}
// Dibuja la foto `key` dentro de (x,y,w,h) con: entrada (zoom/desenfoque o barrido), paneo y zoom lentos,
// balanceo de cámara en mano, reflejo de luz y salida con empuje. o: {t0,t1,f0,f1,z0,z1,r0,r1,enter,exit,tag}
function cine(key, x, y, w, h, t, o = {}) {
  const img = IMG[key]; if (!img) return;
  const t0 = o.t0 ?? 0, t1 = o.t1 ?? 999;
  if (t < t0 - .01 || t > t1 + .01) return;
  const ent = eOut(prog(t, t0, t0 + .75)), ex = eIn(prog(t, t1 - .4, t1));
  const k = eInOut(prog(t, t0, t1));
  const f0 = o.f0 || [.5, .4], f1 = o.f1 || f0;
  let z = lerp(o.z0 ?? 1.05, o.z1 ?? 1.2, k);
  let rot = lerp(o.r0 ?? -.012, o.r1 ?? .012, k);
  let dx = Math.sin(t * 1.3) * 4 + Math.sin(t * 2.3 + 1) * 2.5, dy = Math.sin(t * 1.7 + 2) * 3;
  let blur = 0, alpha = 1, whip = 0;
  if ((o.enter || 'zoom') === 'zoom') { z *= 1 + .28 * (1 - ent); blur += 14 * (1 - ent); rot += -.04 * (1 - ent); alpha = clamp(ent * 1.6); }
  else { whip = (1 - ent) * (o.enter === 'whipL' ? -1 : 1); blur += 5 * (1 - ent); alpha = clamp(ent * 2); }
  if ((o.exit || 'push') === 'push') { z *= 1 + .14 * ex; blur += 10 * ex; alpha *= 1 - ex * .9; }
  const sc = Math.max(w / img.width, h / img.height) * z, sw = w / sc, sh = h / sc;
  const cx = clamp(lerp(f0[0], f1[0], k) * img.width, sw / 2, img.width - sw / 2);
  const cy = clamp(lerp(f0[1], f1[1], k) * img.height, sh / 2, img.height - sh / 2);
  ctx.save(); ctx.globalAlpha *= alpha;
  // sombra y recorte
  shadow(50, '#000d', 20); ctx.fillStyle = '#000'; rr(x, y, w, h, 10); ctx.fill(); noShadow();
  rr(x, y, w, h, 10); ctx.clip();
  ctx.translate(x + w / 2 + dx + whip * w * .55, y + h / 2 + dy); ctx.rotate(rot);
  const draw = (ox, a) => { ctx.globalAlpha = alpha * a; ctx.drawImage(img, cx - sw / 2, cy - sh / 2, sw, sh, -w / 2 - 8 + ox, -h / 2 - 8, w + 16, h + 16); };
  ctx.filter = `blur(${blur.toFixed(1)}px) contrast(1.08) saturate(.88)`;
  if (Math.abs(whip) > .02) { for (let i = 4; i >= 0; i--) draw(-whip * i * 38, i === 0 ? 1 : .22); } else draw(0, 1);
  ctx.filter = 'none'; ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.globalAlpha = alpha;
  // gradación de color tipo cine (sombras azules, luces cálidas)
  ctx.globalCompositeOperation = 'soft-light';
  const cg = ctx.createLinearGradient(x, y, x + w, y + h); cg.addColorStop(0, 'rgba(40,90,190,.55)'); cg.addColorStop(1, 'rgba(255,170,90,.35)');
  ctx.fillStyle = cg; ctx.fillRect(x, y, w, h);
  ctx.globalCompositeOperation = 'source-over';
  const vg = ctx.createRadialGradient(x + w / 2, y + h / 2, Math.min(w, h) * .35, x + w / 2, y + h / 2, Math.max(w, h) * .75);
  vg.addColorStop(0, 'rgba(0,0,0,0)'); vg.addColorStop(1, 'rgba(0,0,0,.5)'); ctx.fillStyle = vg; ctx.fillRect(x, y, w, h);
  // reflejo de luz que cruza la foto al entrar
  const ls = prog(t, t0 + .35, t0 + 1.6);
  if (ls > 0 && ls < 1) {
    const lx = lerp(x - w * .6, x + w * 1.4, eInOut(ls));
    ctx.globalCompositeOperation = 'screen';
    const lg = ctx.createLinearGradient(lx - 160, y, lx + 160, y + 80);
    lg.addColorStop(0, 'rgba(255,255,255,0)'); lg.addColorStop(.5, 'rgba(255,240,220,.28)'); lg.addColorStop(1, 'rgba(255,255,255,0)');
    ctx.fillStyle = lg; ctx.fillRect(x, y, w, h); ctx.globalCompositeOperation = 'source-over';
  }
  ctx.restore();
  // visor de cámara + etiqueta
  withAlpha(alpha, () => {
    ctx.save(); ctx.strokeStyle = 'rgba(255,255,255,.85)'; ctx.lineWidth = 4; ctx.lineCap = 'square';
    const L = 40, m = 22;
    [[x + m, y + m, 1, 1], [x + w - m, y + m, -1, 1], [x + m, y + h - m, 1, -1], [x + w - m, y + h - m, -1, -1]].forEach(([qx, qy, sx, sy]) => {
      ctx.beginPath(); ctx.moveTo(qx + sx * L, qy); ctx.lineTo(qx, qy); ctx.lineTo(qx, qy + sy * L); ctx.stroke();
    });
    if (o.cross) { ctx.strokeStyle = 'rgba(254,74,85,.8)'; ctx.lineWidth = 2; const fx = x + w * o.cross[0], fy = y + h * o.cross[1], R = 60 + 6 * Math.sin(t * 4);
      ctx.beginPath(); ctx.arc(fx, fy, R, 0, 7); ctx.stroke(); [[1, 0], [-1, 0], [0, 1], [0, -1]].forEach(([a, b]) => { ctx.beginPath(); ctx.moveTo(fx + a * (R - 14), fy + b * (R - 14)); ctx.lineTo(fx + a * (R + 18), fy + b * (R + 18)); ctx.stroke(); }); }
    ctx.restore();
    if (o.tag) {
      const kt = eOut(prog(t, t0 + .4, t0 + .9));
      ctx.font = F(700, 26, TYPE); const tw = ctx.measureText(o.tag).width + 34;
      ctx.save(); ctx.globalAlpha *= kt; ctx.translate((1 - kt) * -40, 0);
      ctx.fillStyle = P.red; ctx.fillRect(x + 22, y + h - 76, tw, 46);
      txt(o.tag, x + 39, y + h - 52, F(700, 26, TYPE), P.white, 'left', 'middle'); ctx.restore();
    }
    if (o.rec) {
      const on = Math.floor(t * 1.5) % 2 === 0;
      txt('●', x + w - 150, y + 62, F(700, 26), on ? P.red : 'rgba(254,74,85,.3)', 'left', 'middle');
      const s = Math.max(0, t - t0); txt(`00:${String(Math.floor(s)).padStart(2, '0')}:${String(Math.floor((s % 1) * 30)).padStart(2, '0')}`, x + w - 120, y + 62, F(700, 22, TYPE), 'rgba(255,255,255,.85)', 'left', 'middle');
    }
  });
}
// Fondo de profundidad: copia desenfocada que se mueve en sentido contrario (paralaje)
function backdrop(key, t, a, dir = 1) {
  const b = BLUR[key]; if (!b || a <= 0) return;
  const s = Math.max(W / b.width, H / b.height) * 1.25, w = b.width * s, h = b.height * s;
  ctx.save(); ctx.globalAlpha = a * .38;
  ctx.drawImage(b, (W - w) / 2 - dir * Math.sin(t * .25) * 50 - dir * t * 4 % 60, (H - h) / 2, w, h);
  ctx.restore();
}

// ---------------------------------------------------------------- fondo, grano, viñeta, destellos
function background(t) {
  const g = ctx.createLinearGradient(0, 0, 0, H); g.addColorStop(0, P.bg0); g.addColorStop(1, P.bg1);
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  // haz de luz de lámpara que se mueve lento
  const lx = W * .5 + Math.sin(t * .3) * 220, ly = H * .32;
  const lg = ctx.createRadialGradient(lx, ly, 0, lx, ly, 900); lg.addColorStop(0, 'rgba(120,160,255,.13)'); lg.addColorStop(1, 'rgba(120,160,255,0)');
  ctx.fillStyle = lg; ctx.fillRect(0, 0, W, H);
  // polvo flotando en la luz
  const r = rng(3);
  for (let i = 0; i < 46; i++) { const px = (r() * W + t * (8 + r() * 14)) % W, py = (r() * H - t * (5 + r() * 10) + H * 4) % H, s = 1 + r() * 2.5;
    ctx.fillStyle = `rgba(220,230,255,${.08 + r() * .18})`; ctx.beginPath(); ctx.arc(px, py, s, 0, 7); ctx.fill(); }
}
function filmFx(t, frame) {
  // destello cálido (light leak)
  const lk = .5 + .5 * Math.sin(t * .7);
  const g = ctx.createRadialGradient(W + 80, H * .15 + Math.sin(t * .4) * 200, 0, W + 80, H * .15, 700);
  g.addColorStop(0, `rgba(255,120,80,${.10 * lk})`); g.addColorStop(1, 'rgba(255,120,80,0)');
  ctx.globalCompositeOperation = 'screen'; ctx.fillStyle = g; ctx.fillRect(0, 0, W, H); ctx.globalCompositeOperation = 'source-over';
  // viñeta
  const v = ctx.createRadialGradient(W / 2, H / 2, H * .28, W / 2, H / 2, H * .72); v.addColorStop(0, 'rgba(0,0,0,0)'); v.addColorStop(1, 'rgba(0,0,0,.55)');
  ctx.fillStyle = v; ctx.fillRect(0, 0, W, H);
  // grano de película (cambia cada cuadro)
  const r = rng(frame * 131 + 7), ox = -Math.floor(r() * 512), oy = -Math.floor(r() * 512);
  ctx.save(); ctx.globalAlpha = .07; ctx.globalCompositeOperation = 'overlay';
  for (let yy = oy; yy < H; yy += 512) for (let xx = ox; xx < W; xx += 512) ctx.drawImage(GRAIN, xx, yy);
  ctx.restore();
  // rayas finas de película de vez en cuando
  if (r() < .25) { ctx.fillStyle = `rgba(255,255,255,${.04 + r() * .05})`; ctx.fillRect(r() * W, 0, 1.5, H); }
}

// ---------------------------------------------------------------- cabecera: marca + INVESTIGACIÓN + capítulo
const CHAP = { s1: 'EXPEDIENTE ABIERTO', s2: 'SUJETO 01', s3: 'SUJETO 02', s4: 'LA CONFESIÓN', s5: 'LAS REACCIONES', s6: 'ESTADO DEL CASO', s7: 'TU VEREDICTO' };
function sceneAt(t) { for (const k in SCENES) if (t >= SCENES[k][0] && t < SCENES[k][1]) return k; return 's7'; }
function header(t) {
  const a = eOut(prog(t, 0, .5));
  withAlpha(a, () => {
    magnifier(78, 92, 22);
    txt('CAPITAL', 128, 88, F(800, 30), P.white); txt('CURIOSO', 128, 120, F(800, 30), P.red);
    txt('@capitalcuriosoo', W - 60, 106, F(600, 28), 'rgba(255,255,255,.85)', 'right');
  });
  // bloque INVESTIGACIÓN
  const y = 160, h = 92, k = eBack(prog(t, .1, .55));
  ctx.save(); ctx.translate(lerp(-600, 0, k), 0);
  shadow(24, '#000a', 8); ctx.fillStyle = '#050E20'; ctx.fillRect(40, y, 486, h); noShadow();
  ctx.strokeStyle = P.red; ctx.lineWidth = 4; ctx.strokeRect(42, y + 2, 482, h - 4);
  ctx.save(); ctx.translate(92, y + h / 2 - 6); ctx.scale(.9, .9); magnifier(0, 0, 20); ctx.restore();
  ctx.letterSpacing = '3px'; txt('INVESTIGACIÓN', 136, y + h / 2 + 3, F(700, 50, 'Oswald'), P.white, 'left', 'middle'); ctx.letterSpacing = '0px';
  ctx.restore();
  // tira de papel con el capítulo (se re-escribe a máquina en cada escena)
  const kp = eOut(prog(t, .45, .9));
  if (kp > 0) {
    const sc = sceneAt(t), st = SCENES[sc][0], label = CHAP[sc];
    const n = Object.keys(SCENES).indexOf(sc);
    const kt = sc === 's1' ? prog(t, .6, 1.3) : prog(t, st + .05, st + .55);
    const ex = 544, ew = (W - 40 - ex) * kp;
    ctx.save(); ctx.beginPath(); ctx.rect(ex, y + 8, ew, h - 16); ctx.clip();
    paper(ex, y + 8, W - 40 - ex, h - 16, 0, { sh: 0 });
    const s = typed(`${n + 1}/7 · ${label}`, kt);
    txt(s, ex + 20, y + h / 2 + 3, F(700, 30, TYPE), P.ink, 'left', 'middle');
    if (kt < 1) { ctx.font = F(700, 30, TYPE); cursorAt(ex + 20 + ctx.measureText(s).width, y + h / 2 + 14, 30, t * 3, P.red); }
    ctx.restore();
  }
}

// ---------------------------------------------------------------- subtítulos palabra por palabra
const CHUNKS = (() => {
  const out = [];
  WORDS.forEach((ws, si) => { let cur = []; ws.forEach((w, i) => { cur.push(w); const end = /[.,:?!»]$|\.\.\.$/.test(w.w);
    if (cur.length >= 5 || (end && cur.length >= 2) || i === ws.length - 1) { out.push({ si, words: cur }); cur = []; } }); });
  out.forEach(c => { c.s = c.words[0].s; });
  out.forEach((c, i) => { const nx = out[i + 1]; c.e = (nx && nx.si === c.si) ? nx.s : c.words[c.words.length - 1].e + .25; });
  return out;
})();
function captions(t) {
  if (t >= K.s6Q - .1 || inS(t, 's7')) return;
  const ch = CHUNKS.find(c => t >= c.s - .02 && t < c.e); if (!ch) return;
  const font = F(800, 58), maxW = 900, cy = 1500; ctx.font = font;
  const items = ch.words.map(w => ({ ...w, up: w.w.toUpperCase(), wd: ctx.measureText(w.w.toUpperCase()).width }));
  const sp = 18, lines = [[]]; let lw = 0;
  items.forEach(it => { if (lw + it.wd > maxW && lines[lines.length - 1].length) { lines.push([]); lw = 0; } lines[lines.length - 1].push(it); lw += it.wd + sp; });
  const lh = 78, y0 = cy - (lines.length - 1) * lh / 2;
  lines.forEach((ln, li) => {
    const tw = ln.reduce((a, b) => a + b.wd, 0) + sp * (ln.length - 1); let x = W / 2 - tw / 2;
    ln.forEach(it => {
      const k = prog(t, it.s - .02, it.s + .14);
      if (k > 0) {

// ---------------------------------------------------------------- transición: destello + corte con glitch
function transitions(t) {
  for (const k of ['s2', 's3', 's4', 's5', 's6', 's7']) {
    const b = SCENES[k][0], d = t - b;
    if (d < -.12 || d > .3) continue;

    // cortes horizontales desplazados (glitch)
    for (let i = 0; i < 7; i++) { const sy = r() * H, sh = 20 + r() * 120, dx = (r() - .5) * 90; ctx.drawImage(cv, 0, sy, W, sh, dx, sy, W, sh); }
    // separación de color
    ctx.save(); ctx.globalCompositeOperation = 'screen'; ctx.globalAlpha = .35 * (1 - Math.abs(d) / .3);
    ctx.fillStyle = 'rgba(255,0,40,.5)'; ctx.fillRect(0, 0, W, H); ctx.restore();

}

      const kp = eBack(prog(kt, p.at, p.at + .15)); if (kp <= 0) return;
      ctx.save(); ctx.translate(p.x, ty); ctx.scale(kp, kp); pin(0, 0, p.fut ? '#FFD34A' : P.red); ctx.restore();
      withAlpha(kp, () => {
        const al = p.x === x0 ? 'left' : p.x === x1 ? 'right' : 'center', ox = p.x === x0 ? -40 : p.x === x1 ? 40 : 0;
        txt(p.top, p.x + ox, ty - 34, F(700, 28, TYPE), p.fut ? '#FFD34A' : P.white, al);
        wrap(p.l, 280, F(400, 24, TYPE)).forEach((ln, i) => txt(ln, p.x + ox, ty + 56 + i * 30, F(400, 24, TYPE), P.gray, al));
      });
    });
    ctx.restore();
  }
}

// ---------- 5 · LAS REACCIONES (42.25 – 53.8 s): tres expedientes
function scene5(t) {
  const [a, b] = SCENES.s5, ko = eIn(prog(t, b - .3, b));
  const rows = [
    { y: 290, at: a + .05, chip: 'TRUMP', title: 'LO DEFIENDE', body: 'Dice que Huang le aseguró que no sabía que era espía.', key: 'trump', f0: [.5, .36], f1: [.5, .42], dir: 'whipL' },
    { y: 638, at: K.s5China - .15, chip: 'CHINA', title: 'LO NIEGA', body: 'Habla de «difamaciones».', key: 'flag' },
    { y: 986, at: K.s5Cong - .15, chip: 'CONGRESO DE EE.UU.', title: 'LO CITA', body: 'Reunión a puerta cerrada el 18 de noviembre.', key: 'capitolio', f0: [.42, .5], f1: [.58, .55], dir: 'whipR' },
  ];
  const act = t >= rows[2].at ? 2 : t >= rows[1].at ? 1 : 0;
  rows.forEach((r, i) => {
    const k = eOut(prog(t, r.at, r.at + .5)); if (k <= 0) return;
    const sx = 60, sw = 440, sh = 330;
    ctx.save(); ctx.globalAlpha = 1 - ko;
    if (r.key === 'flag') withAlpha(clamp(k * 2), () => { ctx.save(); shadow(30, '#000c', 12); ctx.fillStyle = '#000'; ctx.fillRect(sx, r.y, sw, sh); noShadow(); ctx.restore(); chinaFlag(sx, r.y, sw, sh, t); ctx.strokeStyle = 'rgba(255,255,255,.7)'; ctx.lineWidth = 3; ctx.strokeRect(sx, r.y, sw, sh); });
    else cine(r.key, sx, r.y, sw, sh, t, { t0: r.at, t1: b + .5, f0: r.f0, f1: r.f1, z0: 1.05, z1: 1.3, enter: r.dir, exit: 'none' });
    // nota del expediente
    const px = 520, pw = 500, on = i === act;
    ctx.translate((1 - k) * 600, 0); ctx.globalAlpha *= on ? 1 : .55;
    paper(px, r.y, pw, sh, i % 2 ? .01 : -.01, { sh: 24, fn: (w, h) => {
      ctx.fillStyle = P.red; ctx.fillRect(0, 0, w, 10);
      txt(`REACCIÓN ${i + 1}`, 26, 54, F(700, 22, TYPE), P.inkSoft);
      txt(r.chip, 26, 92, F(700, 30, TYPE), P.red);
      txt(r.title, 26, 168, F(700, 72, 'Oswald'), P.ink);
      wrap(r.body, w - 60, F(700, 28, TYPE)).forEach((l, j) => txt(typed(l, prog(t, r.at + .3 + j * .4, r.at + .9 + j * .4)), 26, 220 + j * 36, F(700, 28, TYPE), P.inkSoft));
      if (i === 2) {
        const kc = eBack(prog(t, K.s5Date - .1, K.s5Date + .3));
        if (kc > 0) { ctx.save(); ctx.translate(w - 90, 96); ctx.scale(kc, kc); ctx.rotate(.08);
          shadow(14, '#0008', 6); ctx.fillStyle = '#fff'; ctx.fillRect(-64, -64, 128, 136); noShadow();
          ctx.fillStyle = P.red; ctx.fillRect(-64, -64, 128, 40); txt('NOV', 0, -43, F(800, 24), '#fff', 'center', 'middle'); txt('18', 0, 22, F(700, 72, 'Oswald'), P.navy, 'center', 'middle'); ctx.restore(); }
      }
    } });
    if (on) { ctx.strokeStyle = P.red; ctx.lineWidth = 5; ctx.strokeRect(px - 6, r.y - 6, pw + 12, sh + 12); }
    ctx.restore();
  });
}

// ---------- 6 · ESTADO DEL CASO (53.8 – 61.1 s)
function scene6(t) {
  const [a, b] = SCENES.s6, q = K.s6Q;
  const kq = eInOut(prog(t, q - .3, q + .4));
  // informe de estado
  const ki = eOut(prog(t, a + .05, a + .5));
  if (ki > 0 && kq < 1) {
    ctx.save(); ctx.globalAlpha = 1 - kq; ctx.translate(0, (1 - ki) * 120 - kq * 200);
    paper(80, 360, 920, 640, -.01, { lines: 0, fn: (w, h) => {
      txt('INFORME · ESTADO DEL CASO', 40, 64, F(700, 28, TYPE), P.red);
      ctx.fillStyle = 'rgba(28,35,51,.3)'; ctx.fillRect(40, 86, w - 80, 2);
      const items = [['Infidelidad', 'ADMITIDA POR HUANG', P.ink, a + .3], ['Espionaje', 'PRESUNTO · SEGÚN REPORTES', P.red, a + .9], ['Filtración de secretos', 'SIN PRUEBAS (POR AHORA)', '#1E7A46', cue('s6', 'pruebas') - .2]];
      items.forEach(([lab, st, col, at], i) => {
        const kk = prog(t, at, at + .6), yy = 190 + i * 150; if (kk <= 0) return;
        ctx.strokeStyle = P.ink; ctx.lineWidth = 4; ctx.strokeRect(40, yy - 40, 52, 52);
        const ck = eOut(prog(t, at + .3, at + .6));
        if (ck > 0) { ctx.strokeStyle = col; ctx.lineWidth = 8; ctx.lineCap = 'round'; ctx.beginPath(); ctx.moveTo(50, yy - 14); ctx.lineTo(50 + 14 * clamp(ck * 2), yy - 14 + 16 * clamp(ck * 2)); if (ck > .5) ctx.lineTo(64 + 30 * (ck - .5) * 2, yy + 2 - 46 * (ck - .5) * 2); ctx.stroke(); }
        txt(typed(lab, kk), 120, yy - 6, F(700, 40, TYPE), P.ink);
        txt(typed(st, prog(t, at + .3, at + .9)), 120, yy + 40, F(700, 30, TYPE), col);
      });
    } });
    stamp('abierto', ['CASO', 'ABIERTO'], 790, 900, -.16, lerp(2, .7, eOut(prog(t, cue('s6', 'secretos.') - .1, cue('s6', 'secretos.') + .15))) * (t > cue('s6', 'secretos.') - .1 ? 1 : 0), 1);
    ctx.restore();
  }
  // gran pregunta sobre Jensen en penumbra
  if (t >= q - .3) {
    const kb = eOut(prog(t, q - .3, q + .6));
    ctx.save(); ctx.globalAlpha = kb;
    cine('jensen', 0, 260, W, 1180, t, { t0: q - .3, t1: b + .5, f0: [.5, .3], f1: [.5, .26], z0: 1.05, z1: 1.2, exit: 'none' });
    const dk = ctx.createLinearGradient(0, 260, 0, 1440); dk.addColorStop(0, 'rgba(3,11,26,.55)'); dk.addColorStop(.5, 'rgba(3,11,26,.65)'); dk.addColorStop(1, 'rgba(3,11,26,.95)');
    ctx.fillStyle = dk; ctx.fillRect(0, 260, W, 1180);
    ctx.restore();
    const lines = [['¿PUEDE'], ['SOBREVIVIR'], ['EL', 'REY'], ['DE', 'LA', 'IA?']]; let idx = 0;
    const zs = 1 + .06 * prog(t, q, b), fade = 1 - eIn(prog(t, b - .3, b));
    ctx.save(); ctx.globalAlpha = fade; ctx.translate(W / 2, 1000); ctx.scale(zs, zs); ctx.translate(-W / 2, -1000);
    lines.forEach((ln, li) => {
      const font = F(700, 150, 'Oswald'); ctx.font = font;
      const sp = 34, ws = ln.map(w => ctx.measureText(w).width), tw = ws.reduce((x, y) => x + y, 0) + sp * (ln.length - 1); let x = W / 2 - tw / 2;
      ln.forEach((w, wi) => {
        const t0 = q + .15 + idx * .2, k = prog(t, t0, t0 + .22); idx++;
        if (k > 0) { const s = 1.6 - .6 * eOut(k); ctx.save(); ctx.translate(x + ws[wi] / 2, 760 + li * 158); ctx.scale(s, s); ctx.globalAlpha *= k;
          ctx.font = font; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; shadow(30, '#000', 10); ctx.fillStyle = (w === 'REY' || w === 'IA?') ? P.red : P.white; ctx.fillText(w, 0, 0); ctx.restore(); }
        x += ws[wi] + sp;
      });
    });
    ctx.restore();
  }
}

// ---------- 7 · TU VEREDICTO (61.1 – 66.5 s)
function scene7(t) {
  const [a, b] = SCENES.s7, end = eIn(prog(t, b - .6, b - .1));
  ctx.save(); ctx.globalAlpha = 1 - end;
  const kh = eOut(prog(t, a + .1, a + .5));
  paper(110, 380, 860, 300, -.012, { sh: 30, fn: (w, h) => {
    txt('EXPEDIENTE 001 · CASO NVIDIA', w / 2, 60, F(700, 26, TYPE), P.red, 'center');
    txt(typed('¿Qué debe hacer', prog(t, a + .2, a + .7)), w / 2, 150, F(800, 64), P.ink, 'center');
    txt(typed('Jensen Huang?', prog(t, a + .6, a + 1.1)), w / 2, 232, F(800, 64), P.ink, 'center');
  } });
  ctx.restore();
  ctx.save(); ctx.globalAlpha = (1 - end) * kh;
  stamp('veredicto', ['TU VEREDICTO'], W / 2, 360, -.05, lerp(1.8, .62, eOut(prog(t, a + .1, a + .4))), 1);
  const opts = [{ n: '1', t: 'DEBE RENUNCIAR', col: P.red }, { n: '2', t: 'DEBE SEGUIR', col: '#2C5BA8' }];
  opts.forEach((o, i) => {
    const t0 = a + .7 + i * .25, k = eBack(prog(t, t0, t0 + .45)); if (k <= 0) return;
    const y = 760 + i * 200, tap = Math.max(0, Math.sin((t - a) * Math.PI * 1.2 - i * Math.PI)) ** 6, s = (.6 + .4 * k) * (1 + .03 * tap);
    ctx.save(); ctx.translate(W / 2, y + 80); ctx.scale(s, s); ctx.rotate(i ? .01 : -.01);
    paper(-440, -80, 880, 160, 0, { sh: 24, fn: (w, h) => {
      ctx.fillStyle = o.col; ctx.fillRect(0, 0, 150, h);
      txt(o.n, 75, 88, F(700, 100, 'Oswald'), '#fff', 'center', 'middle');
      txt(o.t, 190, 92, F(700, 62, 'Oswald'), P.ink, 'left', 'middle');
    } });
    ctx.strokeStyle = o.col; ctx.lineWidth = 4 + 6 * tap; ctx.strokeRect(-440, -80, 880, 160);
    ctx.restore();
  });
  const kc = eBack(prog(t, a + 1.2, a + 1.6));
  if (kc > 0) {
    const pulse = 1 + .05 * Math.sin((t - a) * 6);
    ctx.save(); ctx.translate(W / 2, 1260); ctx.scale(kc * pulse, kc * pulse);
    ctx.fillStyle = '#fff'; rr(-360, -70, 120, 96, 26); ctx.fill(); ctx.beginPath(); ctx.moveTo(-330, 20); ctx.lineTo(-345, 52); ctx.lineTo(-300, 22); ctx.fill();
    [-325, -300, -275].forEach(x => { ctx.fillStyle = P.navy; ctx.beginPath(); ctx.arc(x, -22, 8, 0, 7); ctx.fill(); });
    txt('COMENTA 1 O 2', -210, 2, F(700, 92, 'Oswald'), '#fff', 'left', 'middle'); ctx.restore();
    const ay = 1380 + 14 * Math.sin((t - a) * 6); ctx.fillStyle = P.red; ctx.beginPath(); ctx.moveTo(W / 2 - 34, ay); ctx.lineTo(W / 2 + 34, ay); ctx.lineTo(W / 2, ay + 40); ctx.fill();
  }
  ctx.restore();
}

// ================================================================ cuadro completo
function draw(t) {
  ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.globalAlpha = 1; ctx.filter = 'none'; ctx.globalCompositeOperation = 'source-over';
  const frame = Math.round(t * FPS);
  background(t);
  if (inS(t, 's1')) scene1(t);
  if (inS(t, 's2')) scene2(t);
  if (inS(t, 's3')) scene3(t);
  if (inS(t, 's4')) scene4(t);
  if (inS(t, 's5')) scene5(t);
  if (inS(t, 's6')) scene6(t);
  if (t >= SCENES.s7[0]) scene7(t);
  filmFx(t, frame);
  const hd = 1 - eIn(prog(t, DURATION - .8, DURATION - .25));
  withAlpha(hd, () => header(t));
  captions(t);
  transitions(t);
  // apertura desde negro y fundido final al azul del cierre de Capital Curioso
  const o = 1 - prog(t, 0, .45); if (o > 0) { ctx.fillStyle = `rgba(0,0,0,${o})`; ctx.fillRect(0, 0, W, H); }
  const f = prog(t, DURATION - .45, DURATION - .05); if (f > 0) { ctx.fillStyle = `rgba(10,40,90,${f})`; ctx.fillRect(0, 0, W, H); }
}

// ================================================================ efectos de sonido (los lee musica.py)
window.SFX = (() => {
  const s = [{ t: 0.0, type: 'sting' }, { t: 0.1, type: 'impact' }];
  ['s2', 's3', 's4', 's5', 's6', 's7'].forEach(k => s.push({ t: SCENES[k][0] - .2, type: 'whoosh' }));
  s.push({ t: K.s1Headline - .1, type: 'typing', dur: 1.6 }, { t: K.s1Sub - .05, type: 'stamp' });
  s.push({ t: SCENES.s2[0] + .4, type: 'typing', dur: 1.2 }, { t: K.s2Count, type: 'counter', dur: 3.0 }, { t: cue('s2', 'valiosas') - .1, type: 'pop' });
  s.push({ t: SCENES.s3[0] + .4, type: 'typing', dur: 1.2 });
  s.push({ t: K.s3Map + .2, type: 'pop' }, { t: K.s3Map + .5, type: 'pop' }, { t: K.s3China - .15, type: 'pop' }, { t: K.s3China, type: 'stamp' });
  s.push({ t: K.s3NYT - .2, type: 'swoosh_up' }, { t: K.s3NYT + .1, type: 'typing', dur: 2.4 });
  s.push({ t: SCENES.s4[0] + .3, type: 'typing', dur: .9 }, { t: K.s4Quote, type: 'typing', dur: K.s4QuoteEnd - K.s4Quote - .1 }, { t: K.s4Inv - .05, type: 'stamp' });
  s.push({ t: K.s5China - .15, type: 'swoosh_up' }, { t: K.s5Cong - .15, type: 'swoosh_up' }, { t: K.s5Date, type: 'pop' });
  s.push({ t: SCENES.s6[0] + .3, type: 'typing', dur: 1.2 }, { t: cue('s6', 'secretos.') - .05, type: 'stamp' }, { t: K.s6Q + .15, type: 'impact' });
  s.push({ t: SCENES.s7[0] + .1, type: 'stamp' }, { t: SCENES.s7[0] + .7, type: 'pop' }, { t: SCENES.s7[0] + .95, type: 'pop' }, { t: SCENES.s7[0] + 1.2, type: 'impact_small' });
  return s.sort((x, y) => x.t - y.t);
})();
window.SUBS = CHUNKS.map(c => ({ s: c.s, e: c.e, text: c.words.map(w => w.w).join(' ') }));
window.TIMING = { scenes: SCENES, duration: DURATION, question: K.s6Q };

// ================================================================ arranque
async function loadFonts() {
  const list = [['Poppins', 600, 'poppins'], ['Poppins', 700, 'poppins'], ['Poppins', 800, 'poppins'], ['Poppins', 900, 'poppins'], ['Oswald', 700, 'oswald'],
    ['Courier Prime', 400, 'courier-prime'], ['Courier Prime', 700, 'courier-prime'], ['Special Elite', 400, 'special-elite']];
  await Promise.all(list.map(async ([fam, wgt, file]) => { const f = new FontFace(fam, `url(fonts/${file}-latin-${wgt}-normal.woff2)`, { weight: String(wgt) }); await f.load(); document.fonts.add(f); }));
}
window.renderFrame = t => draw(t);
window.ready = Promise.all([loadFonts(), loadPhotos()]).then(() => { makeTextures(); draw(0); return true; });

if (!/[?&]render/.test(location.search)) {
  document.body.classList.add('preview');
  const play = document.getElementById('play'), scrub = document.getElementById('scrub'), tc = document.getElementById('tc');
  let playing = false, t = 0, last = 0;
  const tick = now => { if (playing) { t += (now - last) / 1000; if (t >= DURATION) { t = DURATION - .001; playing = false; play.textContent = '▶︎'; } scrub.value = t; } last = now; draw(t); tc.textContent = t.toFixed(1) + ' s'; requestAnimationFrame(tick); };
  window.ready.then(() => requestAnimationFrame(n => { last = n; tick(n); }));
  play.onclick = () => { playing = !playing; play.textContent = playing ? '❚❚' : '▶︎'; };
  scrub.oninput = () => { t = +scrub.value; };
}
