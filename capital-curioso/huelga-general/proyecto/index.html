<!doctype html>
<html><head><meta charset="utf-8">
<style>
@font-face{font-family:P;font-weight:500;src:url(Poppins-Medium.ttf)}
@font-face{font-family:P;font-weight:600;src:url(Poppins-SemiBold.ttf)}
@font-face{font-family:P;font-weight:700;src:url(Poppins-Bold.ttf)}
@font-face{font-family:P;font-weight:800;src:url(Poppins-ExtraBold.ttf)}
@font-face{font-family:P;font-weight:900;src:url(Poppins-Black.ttf)}
@font-face{font-family:PF;font-weight:400 900;src:url(PlayfairDisplay.ttf)}
html,body{margin:0;background:#000;overflow:hidden}
canvas{display:block}
</style></head>
<body><canvas id="c" width="1080" height="1920"></canvas>
<script src="data.js"></script>
<script>
const W=1080,H=1920;
const C=document.getElementById('c'),X=C.getContext('2d');
const NAVY='#0A285A',DEEP='#051634',RED='#FE4A55',BLUE='#4C8DFF',PALE='#B9C6E0',WHITE='#FFFFFF';
const IM={};
const clamp=(v,a=0,b=1)=>Math.max(a,Math.min(b,v));
const lerp=(a,b,p)=>a+(b-a)*p;
const pr=(t,a,b)=>clamp((t-a)/(b-a));
const eo=p=>1-Math.pow(1-p,3);
const eio=p=>p<.5?4*p*p*p:1-Math.pow(-2*p+2,3)/2;
const back=p=>{const c1=1.70158,c3=c1+1;return 1+c3*Math.pow(p-1,3)+c1*Math.pow(p-1,2)};
const elastic=p=>p===0?0:p===1?1:Math.pow(2,-10*p)*Math.sin((p*10-.75)*2*Math.PI/3)+1;
function font(w,s,f='P'){X.font=`${w} ${s}px ${f}`}
function fmt(n){return Math.round(n).toString().replace(/\B(?=(\d{3})+(?!\d))/g,'.')}

// ---------- images ----------
function cover(img,zoom=1,px=0,py=0,rect=[0,0,W,H]){
  const [rx,ry,rw,rh]=rect;
  const s=Math.max(rw/img.width,rh/img.height)*zoom;
  const iw=img.width*s,ih=img.height*s;
  const x=rx+(rw-iw)/2+px*(iw-rw)/2, y=ry+(rh-ih)/2+py*(ih-rh)/2;
  X.save();X.beginPath();X.rect(rx,ry,rw,rh);X.clip();X.drawImage(img,x,y,iw,ih);X.restore();
}
function grade(alphaTop=.55,alphaBot=.75,tint=.25){
  X.fillStyle=`rgba(10,40,90,${tint})`;X.fillRect(0,0,W,H);
  let g=X.createLinearGradient(0,0,0,H);
  g.addColorStop(0,`rgba(5,22,52,${alphaTop})`);g.addColorStop(.32,'rgba(5,22,52,0)');
  g.addColorStop(.62,'rgba(5,22,52,0)');g.addColorStop(1,`rgba(5,22,52,${alphaBot})`);
  X.fillStyle=g;X.fillRect(0,0,W,H);
}
function vignette(a=.55){
  const g=X.createRadialGradient(W/2,H/2,H*.25,W/2,H/2,H*.75);
  g.addColorStop(0,'rgba(0,0,0,0)');g.addColorStop(1,`rgba(0,0,0,${a})`);
  X.fillStyle=g;X.fillRect(0,0,W,H);
}
let NOISE;
function makeNoise(){NOISE=document.createElement('canvas');NOISE.width=NOISE.height=256;const n=NOISE.getContext('2d');const d=n.createImageData(256,256);let s=7;for(let i=0;i<d.data.length;i+=4){s=(s*16807)%2147483647;const v=s%255;d.data[i]=d.data[i+1]=d.data[i+2]=v;d.data[i+3]=255}n.putImageData(d,0,0)}
function grain(t,a=.05){const f=Math.floor(t*30);const ox=(f*97)%256,oy=(f*57)%256;X.save();X.globalAlpha=a;X.globalCompositeOperation='overlay';X.translate(-ox,-oy);X.fillStyle=X.createPattern(NOISE,'repeat');X.fillRect(0,0,W+256,H+256);X.restore()}
function bgNavy(){const g=X.createRadialGradient(W/2,H*.45,50,W/2,H*.45,H*.8);g.addColorStop(0,'#123A7A');g.addColorStop(.55,NAVY);g.addColorStop(1,DEEP);X.fillStyle=g;X.fillRect(0,0,W,H)}
function blurImg(img,alpha,zoom=1.1,blur=14,px=0,py=0){X.save();X.globalAlpha=alpha;X.filter=`blur(${blur}px) grayscale(.5)`;cover(img,zoom,px,py);X.restore();X.filter='none'}

// ---------- drawing helpers ----------
function rr(x,y,w,h,r){X.beginPath();X.moveTo(x+r,y);X.arcTo(x+w,y,x+w,y+h,r);X.arcTo(x+w,y+h,x,y+h,r);X.arcTo(x,y+h,x,y,r);X.arcTo(x,y,x+w,y,r);X.closePath()}
function text(s,x,y,{w=800,size=60,color=WHITE,align='center',base='alphabetic',f='P',shadow=0,alpha=1,ls=0}={}){
  X.save();X.globalAlpha*=alpha;font(w,size,f);X.textAlign=align;X.textBaseline=base;X.fillStyle=color;
  if(ls)X.letterSpacing=ls+'px';
  if(shadow){X.shadowColor='rgba(0,0,0,.6)';X.shadowBlur=shadow;X.shadowOffsetY=shadow/4}
  X.fillText(s,x,y);X.restore();
}
function pop(t,t0,d=.45){return back(pr(t,t0,t0+d))}
function chip(label,x,y,{bg=RED,color=WHITE,size=30,alpha=1,pad=22,align='center'}={}){
  X.save();X.globalAlpha*=alpha;font(800,size);X.letterSpacing='3px';const w=X.measureText(label).width+pad*2,h=size*1.75;
  const x0=align==='center'?x-w/2:x;rr(x0,y-h/2,w,h,h/2);X.fillStyle=bg;X.fill();
  X.fillStyle=color;X.textAlign='center';X.textBaseline='middle';X.fillText(label,x0+w/2,y+size*.06);X.restore();return w;
}
function scaleAt(x,y,s){X.translate(x,y);X.scale(s,s);X.translate(-x,-y)}

// ---------- subtitles (top, word by word) ----------
function subtitles(t){
  const c=SUBS.find(c=>t>=c.s&&t<c.e);if(!c)return;
  const size=66,maxW=940,gap=18;font(800,size);
  const words=c.w.map(([s,a,b])=>({s,a,b,w:X.measureText(s).width}));
  const lines=[[]];let lw=0;
  for(const w of words){if(lw+w.w>maxW&&lines[lines.length-1].length){lines.push([]);lw=0}lines[lines.length-1].push(w);lw+=w.w+gap}
  const y0=330-(lines.length-1)*size*.62;
  lines.forEach((ln,li)=>{
    const tot=ln.reduce((s,w)=>s+w.w,0)+gap*(ln.length-1);let x=W/2-tot/2;const y=y0+li*size*1.24;
    for(const w of ln){
      if(t>=w.a-0.04){
        const p=pr(t,w.a-0.04,w.a+0.14),active=t<w.b+0.05&&t>=w.a-0.04;
        const s=lerp(.6,1,back(p));
        X.save();scaleAt(x+w.w/2,y-size*.35,s);X.globalAlpha=clamp(p*2);
        if(active){rr(x-12,y-size*.98,w.w+24,size*1.3,14);X.fillStyle=RED;X.fill()}
        font(800,size);X.textAlign='left';X.textBaseline='alphabetic';
        X.lineWidth=10;X.strokeStyle='rgba(5,22,52,.85)';X.lineJoin='round';if(!active)X.strokeText(w.s,x,y);
        X.fillStyle=WHITE;X.fillText(w.s,x,y);X.restore();
      }
      x+=w.w+gap;
    }
  });
}
function watermark(){
  X.save();X.globalAlpha=.75;
  const x=64,y=1838;X.lineWidth=5;X.strokeStyle=WHITE;X.beginPath();X.arc(x,y,15,0,Math.PI*2);X.stroke();
  X.strokeStyle=RED;X.lineCap='round';X.lineWidth=7;X.beginPath();X.moveTo(x+12,y+12);X.lineTo(x+24,y+24);X.stroke();
  font(800,26);X.fillStyle=WHITE;X.textBaseline='middle';X.letterSpacing='2px';X.fillText('CAPITAL',x+44,y+2);
  const w=X.measureText('CAPITAL ').width;X.fillStyle=RED;X.fillText('CURIOSO',x+44+w,y+2);X.restore();
}

// ---------- scenes ----------
function sHook(t){
  const z=1.04+t*0.022;cover(IM[2],z,0,-.15+t*.02);
  // progressive darkening after "murió"
  const d=pr(t,5.5,6.3);X.save();X.globalAlpha=d*.45;X.fillStyle='#000';X.fillRect(0,0,W,H);X.restore();
  X.save();X.filter=`saturate(${1-d})`;X.restore();
  grade(.6,.8,.18+.2*d);vignette(.5);
  // 87 AÑOS
  const p=pop(t,0.74,.55);
  if(t>.7){
    X.save();const cy=1080;scaleAt(W/2,cy,lerp(1.35,1,eo(pr(t,.74,1.1)))*(1+0.015*Math.sin(t*2)));X.globalAlpha=clamp(pr(t,.74,.95));
    text('87',W/2,cy,{w:900,size:400,shadow:40});
    rr(W/2-230,cy+40,460,120,14);X.fillStyle=RED;X.fill();
    text('AÑOS',W/2,cy+128,{w:900,size:100,ls:12});
    X.restore();
  }
  // location tag
  if(t>3.3){const a=eo(pr(t,3.34,3.7));X.save();X.globalAlpha=a;X.translate(lerp(-40,0,a),0);
    pin(150,1430,1);text('MADRID',190,1446,{w:800,size:44,align:'left',ls:6,shadow:10});X.restore();}
}
function pin(x,y,s){X.save();X.translate(x,y);X.scale(s,s);X.fillStyle=RED;X.beginPath();X.arc(0,-8,20,Math.PI,0);X.lineTo(0,30);X.closePath();X.fill();X.fillStyle=WHITE;X.beginPath();X.arc(0,-8,8,0,Math.PI*2);X.fill();X.restore()}
function sBlack(t){X.fillStyle='#000';X.fillRect(0,0,W,H);
  const a=pr(t,7.95,8.3)*(1-pr(t,8.6,8.85));
  X.save();X.globalAlpha=a;X.fillStyle=RED;X.fillRect(W/2-60,1000,120,8);X.restore();}
function sVictim(t){
  const lt=t-8.75;cover(IM[8],1.12+lt*.012,lerp(-.5,.4,lt/7.4),0);grade(.65,.85,.3);vignette(.55);
  // fade in from black
  X.save();X.globalAlpha=1-pr(t,8.75,9.15);X.fillStyle='#000';X.fillRect(0,0,W,H);X.restore();
  // counter card
  if(t>11.3){const a=pop(t,11.4,.5);X.save();scaleAt(W/2,900,lerp(.7,1,a));X.globalAlpha=clamp(pr(t,11.4,11.6));
    rr(140,640,800,470,36);X.fillStyle='rgba(5,22,52,.82)';X.fill();X.strokeStyle='rgba(255,255,255,.18)';X.lineWidth=2;X.stroke();
    const n=Math.round(70*eo(pr(t,11.5,12.5)));
    text(String(n),W/2,930,{w:900,size:250,color:WHITE});
    text('AÑOS EN LA MISMA CASA',W/2,1040,{w:800,size:44,color:RED,ls:4});
    // house icon
    houseIcon(W/2,700,1);
    X.restore();}
  // lower third
  if(t>9.4){const a=eo(pr(t,9.45,9.9));const y=1330;X.save();
    X.beginPath();X.rect(0,y-10,lerp(0,W,a),260);X.clip();
    X.fillStyle=RED;X.fillRect(70,y,14,190);
    X.fillStyle='rgba(255,255,255,.96)';X.fillRect(84,y,860,110);
    text('MARICARMEN ABASCAL',114,y+76,{w:900,size:58,color:NAVY,align:'left'});
    X.fillStyle=NAVY;X.fillRect(84,y+110,700,80);
    text('Desahuciada en Madrid',114,y+164,{w:600,size:40,color:WHITE,align:'left'});
    X.restore();}
  // stamp on "desalojó"
  if(t>15.05){const p=pr(t,15.08,15.3);X.save();X.globalAlpha=clamp(p*3)*.92;scaleAt(W/2,1210,lerp(2.2,1,eo(p)));X.translate(W/2,1210);X.rotate(-.12);
    font(900,92);X.letterSpacing='6px';const w=X.measureText('DESALOJADA').width+70;rr(-w/2,-75,w,140,12);X.lineWidth=10;X.strokeStyle=RED;X.stroke();
    X.fillStyle=RED;X.textAlign='center';X.textBaseline='middle';X.fillText('DESALOJADA',0,6);X.restore();}
}
function houseIcon(x,y,s){X.save();X.translate(x,y);X.scale(s,s);X.strokeStyle=RED;X.lineWidth=8;X.lineJoin='round';X.beginPath();X.moveTo(-45,0);X.lineTo(0,-38);X.lineTo(45,0);X.moveTo(-32,-8);X.lineTo(-32,40);X.lineTo(32,40);X.lineTo(32,-8);X.stroke();X.fillStyle=RED;X.fillRect(-10,14,20,26);X.restore()}
function sFire(t){
  const lt=t-16.1;cover(IM[3],1.05+lt*.05,0,0);
  X.fillStyle='rgba(5,22,52,.2)';X.fillRect(0,0,W,H);grade(.7,.6,0);vignette(.5);
  if(t>16.6){const a=eo(pr(t,16.68,17.1));chip('EL DETONANTE',W/2,1500,{alpha:a,size:34})}
}
const RENT=[0,6,15,27,37,44],WAGE=[0,3.5,8,13,18,22];
function sChart(t){
  bgNavy();blurImg(IM[1],.12,1.2,10);vignette(.4);
  const a=eo(pr(t,19.45,19.9));X.save();X.globalAlpha=a;
  text('ALQUILER vs SUELDOS',W/2,560,{w:900,size:70});
  text('Variación acumulada desde 2021',W/2,620,{w:500,size:36,color:PALE});
  const x0=150,x1=930,y0=1400,y1=760,max=50;
  const Y=v=>y0-(v/max)*(y0-y1),Xp=i=>x0+i*(x1-x0)/5;
  X.lineWidth=2;
  for(let v=0;v<=50;v+=10){X.strokeStyle=v?'rgba(255,255,255,.10)':'rgba(255,255,255,.5)';X.beginPath();X.moveTo(x0,Y(v));X.lineTo(x1,Y(v));X.stroke();
    text(v+'%',x0-22,Y(v)+11,{w:600,size:28,color:PALE,align:'right'})}
  for(let i=0;i<6;i++)text(String(2021+i),Xp(i),y0+52,{w:600,size:30,color:PALE});
  X.restore();
  function line(vals,col,t0,t1,label,lab,ly){
    const p=eio(pr(t,t0,t1));if(p<=0)return;const n=5*p;
    X.save();X.lineWidth=12;X.lineCap='round';X.lineJoin='round';X.strokeStyle=col;X.shadowColor=col;X.shadowBlur=24;
    X.beginPath();X.moveTo(Xp(0),Y(vals[0]));let ex=Xp(0),ey=Y(vals[0]);
    for(let i=1;i<=Math.ceil(n);i++){const f=Math.min(1,n-(i-1));ex=lerp(Xp(i-1),Xp(i),f);ey=lerp(Y(vals[i-1]),Y(vals[i]),f);X.lineTo(ex,ey)}
    X.stroke();
    // area
    X.shadowBlur=0;X.globalAlpha=.16;X.lineTo(ex,y0);X.lineTo(Xp(0),y0);X.closePath();X.fillStyle=col;X.fill();X.globalAlpha=1;
    X.fillStyle=WHITE;X.beginPath();X.arc(ex,ey,14,0,Math.PI*2);X.fill();X.fillStyle=col;X.beginPath();X.arc(ex,ey,8,0,Math.PI*2);X.fill();
    // running value
    const v=lerp(0,vals[5],p);
    X.restore();
    const q=pop(t,t1-.15,.5);
    if(p>0.02){X.save();const s=p<1?1:lerp(1,1.0,q);text('+'+Math.round(v)+'%',Math.min(ex,x1-40)-10,ey-36,{w:900,size:p<1?56:lerp(56,84,eo(pr(t,t1,t1+.3))),color:col,align:'right',shadow:12});X.restore()}
    // legend label
    chip(label,lab,ly,{bg:col,size:28,alpha:eo(pr(t,t0,t0+.3)),align:'left'});
  }
  line(RENT,RED,20.95,23.4,'ALQUILER',150,1530);
  line(WAGE,BLUE,24.5,26.3,'SUELDOS',530,1530);
  // "la mitad" bracket
  if(t>25.5){const p=eo(pr(t,25.54,25.95));const x=x1+40,ya=Y(44),yb=Y(22);X.save();X.globalAlpha=p;X.strokeStyle=WHITE;X.lineWidth=5;
    X.beginPath();X.moveTo(x-14,ya);X.lineTo(x,ya);X.lineTo(x,lerp(ya,yb,p));X.lineTo(x-14,lerp(ya,yb,p));X.stroke();
    X.translate(x+40,(ya+yb)/2);X.rotate(-Math.PI/2);text('LA MITAD',0,10,{w:900,size:34,ls:4});X.restore();}
  text('Fuente: Idealista / Funcas',W/2,1640,{w:500,size:26,color:PALE,alpha:a*.85});
}
// map
const LON0=-3.7,LAT0=40.0,KX=Math.cos(40*Math.PI/180);
function proj(lon,lat,cx,cy,s){return[cx+(lon-LON0)*KX*s,cy-(lat-LAT0)*s]}
const CITIES=[['Madrid',-3.70,40.42,28.0,'r'],['Barcelona',2.17,41.39,28.5,'l'],['Valencia',-0.38,39.47,28.95,'l'],['Salamanca',-5.66,40.97,29.4,'r']];
function sMap(t){
  bgNavy();
  // background photo fades in on incidents
  const bp=pr(t,33.6,34.2);if(bp>0)blurImg(IM[4],.28*bp*(1-pr(t,38.0,38.4)),1.15,6);const bq=pr(t,38.0,38.4);if(bq>0)blurImg(IM[5],.3*bq,1.15,6);
  X.save();X.strokeStyle='rgba(255,255,255,.05)';X.lineWidth=1;for(let x=0;x<W;x+=60){X.beginPath();X.moveTo(x,0);X.lineTo(x,H);X.stroke()}for(let y=0;y<H;y+=60){X.beginPath();X.moveTo(0,y);X.lineTo(W,y);X.stroke()}X.restore();
  vignette(.5);
  const m=eio(pr(t,33.5,34.2));
  const cx=lerp(560,600,m),cy=lerp(860,700,m),s=lerp(76,52,m)*lerp(.92,1,eo(pr(t,27.25,28)));
  const ma=eo(pr(t,27.25,27.8));
  X.save();X.globalAlpha=ma;X.beginPath();
  for(const ring of SPAIN){ring.forEach(([lo,la],i)=>{const[x,y]=proj(lo,la,cx,cy,s);i?X.lineTo(x,y):X.moveTo(x,y)});X.closePath()}
  X.fillStyle='rgba(76,141,255,.16)';X.fill();X.lineWidth=4;X.strokeStyle='rgba(255,255,255,.85)';X.shadowColor=BLUE;X.shadowBlur=30;X.stroke();X.restore();
  // date chip
  if(t>27.6)chip('11 DE NOVIEMBRE',W/2,lerp(520,500,m),{alpha:eo(pr(t,27.7,28)),size:32,bg:'rgba(255,255,255,.95)',color:NAVY});
  for(const [n,lo,la,t0,side] of CITIES){if(t<t0)continue;const[x,y]=proj(lo,la,cx,cy,s);const p=pop(t,t0,.4);
    const pulse=((t-t0)%1.4)/1.4;X.save();X.globalAlpha=(1-pulse)*.7;X.strokeStyle=RED;X.lineWidth=4;X.beginPath();X.arc(x,y,14+pulse*50,0,Math.PI*2);X.stroke();X.restore();
    X.save();scaleAt(x,y,p);X.fillStyle=RED;X.beginPath();X.arc(x,y,15,0,Math.PI*2);X.fill();X.strokeStyle=WHITE;X.lineWidth=4;X.stroke();
    const fs=lerp(36,28,m);text(n.toUpperCase(),side==='r'?x+26:x-26,y+fs*.36,{w:800,size:fs,align:side==='r'?'left':'right',shadow:12});X.restore();}
  // big banner
  if(t>30.85){const p=pop(t,30.9,.55);const by=lerp(1390,1060,m);X.save();scaleAt(W/2,by,lerp(.5,1,p)*lerp(1,.82,m));X.globalAlpha=clamp(pr(t,30.9,31.1));
    rr(90,by-125,900,250,26);X.fillStyle=RED;X.fill();
    text('1ª HUELGA GENERAL',W/2,by-12,{w:900,size:74});
    const n=t<32.3?'':'EN 14 AÑOS';text(n,W/2,by+82,{w:900,size:74,color:NAVY});
    X.restore();}
  // incident rows
  const rows=[[33.96,'road','CARRETERAS',null,'CORTADAS'],[35.82,'plane','≈',300,'VUELOS CANCELADOS'],[38.2,'cuffs','+',70,'DETENIDOS']];
  rows.forEach(([t0,ic,pre,num,lab],i)=>{if(t<t0-.1)return;const y=1270+i*170;const a=eo(pr(t,t0-.1,t0+.3));
    X.save();X.globalAlpha=a;X.translate(lerp(W,0,a),0);
    rr(90,y,900,145,24);X.fillStyle='rgba(5,22,52,.88)';X.fill();X.strokeStyle='rgba(255,255,255,.15)';X.lineWidth=2;X.stroke();
    X.fillStyle=RED;rr(110,y+18,110,110,20);X.fill();icon(ic,165,y+73);
    if(num){const v=Math.round(num*eo(pr(t,t0,t0+.9)));text(pre+v,250,y+98,{w:900,size:80,align:'left'});font(900,80);const w=X.measureText(pre+num).width;
      text(lab,262+w,y+92,{w:800,size:36,align:'left',color:PALE})}
    else{text(pre,250,y+78,{w:900,size:54,align:'left'});text(lab,250,y+122,{w:800,size:36,align:'left',color:PALE})}
    X.restore();});
}
function icon(k,x,y){X.save();X.translate(x,y);X.strokeStyle=WHITE;X.fillStyle=WHITE;X.lineWidth=7;X.lineCap='round';X.lineJoin='round';
