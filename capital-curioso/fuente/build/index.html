<!doctype html>
<html><head><meta charset="utf-8">
<style>
@font-face{font-family:Anton;src:url(Anton.ttf)}
@font-face{font-family:Oswald;src:url(Oswald.ttf);font-weight:200 700}
@font-face{font-family:Inter;src:url(Inter.ttf);font-weight:100 900}
:root{--navy:#071A3D;--navy2:#0B2A5E;--blue:#1F4FA8;--red:#CE1126;--red2:#E0283C;--white:#F5F7FB;--muted:#AFC0DD}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1080px;height:1920px;overflow:hidden;background:#000}
#stage{position:relative;width:1080px;height:1920px;overflow:hidden;background:var(--navy);font-family:Inter,sans-serif;color:var(--white)}
.abs{position:absolute}
.bg{position:absolute;inset:0;overflow:hidden}
.bg img{position:absolute;display:block}
#shade{position:absolute;inset:0;background:
 linear-gradient(180deg,rgba(2,8,22,.88) 0%,rgba(2,8,22,.55) 22%,rgba(2,8,22,.05) 42%,rgba(2,8,22,.15) 58%,rgba(4,14,38,.8) 82%,rgba(4,14,38,.95) 100%),
 rgba(6,18,46,.18)}
#grain{position:absolute;inset:-200px;background:url(grain.png);opacity:.07;mix-blend-mode:overlay}
#bars{position:absolute;inset:0;pointer-events:none}
.c{left:0;width:1080px;text-align:center}
.anton{font-family:Anton;text-transform:uppercase;line-height:.98;letter-spacing:1px}
.osw{font-family:Oswald;font-weight:700;text-transform:uppercase;letter-spacing:2px}
.tsh{text-shadow:0 6px 30px rgba(0,0,0,.65),0 2px 4px rgba(0,0,0,.5)}
.card{background:linear-gradient(160deg,rgba(11,42,94,.94),rgba(5,20,48,.96));border:2px solid rgba(255,255,255,.14);border-radius:28px;box-shadow:0 24px 70px rgba(0,0,0,.55)}
.chip{display:inline-block;background:var(--red);color:#fff;font-family:Oswald;font-weight:700;text-transform:uppercase;letter-spacing:3px;padding:10px 26px;border-radius:10px;font-size:38px;box-shadow:0 10px 30px rgba(206,17,38,.35)}
.src{font-family:Inter;font-weight:500;font-size:24px;color:var(--muted);letter-spacing:.5px}
.red{color:var(--red2)}
/* subtitles */
#subs{position:absolute;left:50px;width:980px;top:250px;text-align:center;font-family:Inter;font-weight:900;font-size:64px;line-height:1.22;text-transform:uppercase;letter-spacing:-.5px}
#subs span{display:inline-block;margin:0 9px;padding:0 10px;border-radius:12px;text-shadow:0 4px 18px rgba(0,0,0,.9),0 0 3px rgba(0,0,0,.9)}
#subs span.on{background:var(--red);text-shadow:none}
#brand{left:60px;top:118px;display:flex;align-items:center;gap:14px;font-family:Oswald;font-weight:700;font-size:30px;letter-spacing:3px;opacity:.92}
#brand .dot{width:10px;height:10px;border-radius:50%;background:var(--red)}
/* lower third */
.lt{left:60px;top:1500px;width:960px}
.lt .nm{display:inline-block;background:var(--white);color:var(--navy);font-family:Anton;font-size:62px;padding:10px 30px 8px;letter-spacing:1px;border-left:16px solid var(--red)}
.lt .rl{display:inline-block;background:var(--navy2);color:#fff;font-family:Inter;font-weight:600;font-size:34px;padding:14px 30px;margin-top:0;border-left:16px solid var(--blue)}
.flag{display:block}
.row{display:flex;align-items:center}
</style>
<script src="data.js"></script>
</head><body>
<div id="stage">
 <div id="bgs"></div>
 <div id="shade"></div>
 <div id="grain"></div>
 <div id="scenes"></div>
 <div id="subs"></div>
 <div id="brand" class="abs"></div>
 <div id="bars"></div>
</div>
<script>
const $=s=>document.querySelector(s);
const clamp=(x,a=0,b=1)=>Math.min(b,Math.max(a,x));
const P=(t,a,b)=>clamp((t-a)/(b-a));
const eo=x=>1-Math.pow(1-x,3);
const eio=x=>x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2;
const back=x=>{const c1=1.9,c3=c1+1;return 1+c3*Math.pow(x-1,3)+c1*Math.pow(x-1,2)};
const lerp=(a,b,x)=>a+(b-a)*x;

/* ---------- SVG assets ---------- */
function star(cx,cy,r,ri){ri=ri||r*.42;let d='';for(let i=0;i<10;i++){const a=-Math.PI/2+i*Math.PI/5,rr=i%2?ri:r;d+=(i?'L':'M')+(cx+rr*Math.cos(a)).toFixed(2)+','+(cy+rr*Math.sin(a)).toFixed(2)}return d+'Z'}
const FL={
 DOM:`<rect width="160" height="100" fill="#fff"/><rect width="70" height="42" fill="#002D62"/><rect x="90" width="70" height="42" fill="#CE1126"/><rect y="58" width="70" height="42" fill="#CE1126"/><rect x="90" y="58" width="70" height="42" fill="#002D62"/>
  <path d="M71,52 a10,10 0 0 0 18,0" fill="none" stroke="#3a8a3a" stroke-width="2.2"/><path d="M72,44 q-3,6 0,11 M88,44 q3,6 0,11" fill="none" stroke="#3a8a3a" stroke-width="2"/>
  <path d="M75,43 h10 v7 q0,5 -5,7 q-5,-2 -5,-7z" fill="#CE1126"/><path d="M75,43 h4.3 v6 h-4.3z M80.7,49 h4.3 v1 q0,5 -5,7 v-8z" fill="#002D62"/><path d="M79.3,43h1.4v14h-1.4z M75,48.6h10v1.4h-10z" fill="#fff"/>
  <rect x="73" y="40" width="14" height="2.2" rx="1" fill="#002D62"/><rect x="73" y="58.2" width="14" height="2.2" rx="1" fill="#CE1126"/>`,
 USA:(()=>{let s='<rect width="160" height="100" fill="#fff"/>';for(let i=0;i<13;i+=2)s+=`<rect y="${(i*100/13).toFixed(2)}" width="160" height="${(100/13).toFixed(2)}" fill="#B22234"/>`;s+='<rect width="66" height="53.85" fill="#3C3B6E"/>';for(let r=0;r<9;r++){const n=r%2?5:6;for(let c=0;c<n;c++){const x=(r%2?11:5.5)+c*11,y=3+r*5.8;s+=`<path d="${star(x,y,2.1)}" fill="#fff"/>`}}return s})(),

 DZA:`<defs><mask id="cm"><rect width="160" height="100" fill="#fff"/><circle cx="88" cy="50" r="21" fill="#000"/></mask></defs><rect width="80" height="100" fill="#006233"/><rect x="80" width="80" height="100" fill="#fff"/><circle cx="80" cy="50" r="25" fill="#D21034" mask="url(#cm)"/><path d="${star(94,50,10,4.2)}" fill="#D21034" transform="rotate(-18 94 50)"/>`
};
const flag=(c,w,extra='')=>`<svg class="flag" ${extra} width="${w}" height="${w*100/160}" viewBox="0 0 160 100" preserveAspectRatio="none" style="border-radius:${w/40}px;box-shadow:0 8px 24px rgba(0,0,0,.45)">${FL[c]}</svg>`;
const ICON={

function mapSVG(m,id,w,opts={}){
 let s=`<svg id="${id}" viewBox="0 0 ${m.W} ${m.H}" width="${w}" height="${w*m.H/m.W}" style="overflow:visible">`;
 for(const p of m.paths){
  const hi=p.hi; const fill=hi?(opts.hiFill||'#CE1126'):(opts.fill||'#1A3A72');
  s+=`<path class="${hi?'hi hi-'+p.iso:'lo'}" d="${p.d}" fill="${fill}" stroke="${opts.stroke||'#4F72B3'}" stroke-width="${opts.sw||1.2}" stroke-linejoin="round"/>`;
 }
 return s+(opts.extra||'')+'</svg>';
}

E.t1a=add(`<div class="abs c anton tsh" style="top:560px;font-size:250px"><span class="red">RD</span> AL</div>`);
E.t1b=add(`<div class="abs c anton tsh" style="top:800px;font-size:250px">MUNDIAL</div>`);

E.alert=add(`<div class="abs card" style="left:70px;top:1220px;width:940px;height:400px;border-color:rgba(206,17,38,.6)">
 <div class="abs" id="alic" style="left:40px;top:50px">${ICON.alert}</div>

 <div class="abs src" style="left:40px;top:340px">Fuente: Departamento de Estado de EE. UU.</div></div>`);

E.lt3=add(`<div class="abs lt"><div class="nm">GIANNI INFANTINO</div><br><div class="rl">Presidente de la FIFA</div></div>`);
E.fifa=add(`<div class="abs card" style="left:90px;top:1020px;width:900px;height:250px"><div class="abs" style="left:40px;top:62px">${ICON.shield}</div><div class="abs osw" style="left:200px;top:36px;font-size:40px;color:var(--muted)">FIFA:</div><div class="abs anton" style="left:200px;top:96px;font-size:96px;white-space:nowrap">«Catar es seguro»</div></div>`);

 <div class="abs anton" style="left:250px;top:28px;width:440px;text-align:center;font-size:170px;line-height:1"><span id="sc1">0</span><span style="color:var(--muted)"> – </span><span id="sc2">0</span></div>

 <div class="abs osw" style="left:640px;top:24px;font-size:36px;width:120px;text-align:center">PTS</div><div class="abs osw" style="left:790px;top:24px;font-size:36px;width:120px;text-align:center">DG</div>
 <div class="abs trow" id="tr1" style="left:0;top:100px;width:940px;height:140px"><div class="abs anton" style="left:36px;top:36px;font-size:56px;color:var(--muted)">1</div><div class="abs" style="left:96px;top:36px">${flag('USA',110)}</div><div class="abs osw" style="left:230px;top:40px;font-size:50px">Estados Unidos</div><div class="abs anton ptsc" style="left:640px;top:30px;width:120px;text-align:center;font-size:76px" id="p1">0</div><div class="abs anton dgc" style="left:790px;top:30px;width:120px;text-align:center;font-size:76px" id="d1">+0</div></div>
 <div class="abs" style="left:30px;top:243px;width:880px;height:2px;background:rgba(255,255,255,.12)"></div>
 <div class="abs trow" id="tr2" style="left:0;top:250px;width:940px;height:140px"><div class="abs" style="left:0;top:10px;width:12px;height:120px;background:var(--red)"></div><div class="abs anton" style="left:36px;top:36px;font-size:56px;color:var(--muted)">2</div><div class="abs" style="left:96px;top:36px">${flag('DOM',110)}</div><div class="abs osw" style="left:230px;top:40px;font-size:50px">Rep. Dominicana</div><div class="abs anton ptsc" style="left:640px;top:30px;width:120px;text-align:center;font-size:76px" id="p2">0</div><div class="abs anton dgc" style="left:790px;top:30px;width:120px;text-align:center;font-size:76px" id="d2">+0</div></div>
 <div class="abs" id="ptsHL" style="left:640px;top:96px;width:120px;height:300px;border:4px solid #fff;border-radius:16px"></div>

const W5=MAPS.world, I5=MAPS.isl;
