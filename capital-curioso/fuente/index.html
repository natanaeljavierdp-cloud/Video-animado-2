<!doctype html>
<html><head><meta charset="utf-8">
<style>
@font-face{font-family:IDB;src:url(file:///usr/share/fonts/opentype/inter/InterDisplay-Black.otf)}
@font-face{font-family:IDX;src:url(file:///usr/share/fonts/opentype/inter/InterDisplay-ExtraBold.otf)}

<body><canvas id="c" width="1080" height="1920"></canvas>
<script src="geo.js"></script>
<script src="words.js"></script>
<script>
const W=1080,H=1920;
const cv=document.getElementById('c'),ctx=cv.getContext('2d');
const NAVY='#0A285A',DEEP='#051634',RED='#FE4A55',WHITE='#FFFFFF',GREEN='#2BD67B',MUTED='#9FB3D9';
const IMGS={};
const names=['ms','bofa','wells','frustrado','laptop','errorphone','chasebldg','chasebranch','cardphone','phonewood','plane','window','terminal','servers','board','gaming','shaft'];
// ---------- utils ----------
const clamp=(x,a=0,b=1)=>Math.max(a,Math.min(b,x));
const P=(t,a,b)=>clamp((t-a)/(b-a));
const eo=x=>1-Math.pow(1-x,3), eio=x=>x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2, eback=x=>{const c1=1.70158,c3=c1+1;return 1+c3*Math.pow(x-1,3)+c1*Math.pow(x-1,2)};
function rng(seed){let a=seed>>>0;return()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const lerp=(a,b,x)=>a+(b-a)*x;
function mixHex(a,b,x){const pa=[1,3,5].map(i=>parseInt(a.substr(i,2),16)),pb=[1,3,5].map(i=>parseInt(b.substr(i,2),16));return`rgb(${pa.map((v,i)=>Math.round(lerp(v,pb[i],x))).join(',')})`}
function F(fam,size){return `${size}px ${fam}`}
function txt(s,x,y,fam,size,col,align='center',ls=0,alpha=1,base='alphabetic'){ctx.save();ctx.globalAlpha*=alpha;ctx.font=F(fam,size);ctx.fillStyle=col;ctx.textAlign=align;ctx.textBaseline=base;ctx.letterSpacing=ls+'px';ctx.fillText(s,x,y);ctx.restore()}
function tw(s,fam,size,ls=0){ctx.save();ctx.font=F(fam,size);ctx.letterSpacing=ls+'px';const w=ctx.measureText(s).width;ctx.restore();return w}
function rr(x,y,w,h,r){ctx.beginPath();ctx.roundRect(x,y,w,h,r)}
// Ken Burns cover
function cover(img,x,y,w,h,z=1,px=0,py=0,alpha=1){
  const I=IMGS[img];const s=Math.max(w/I.width,h/I.height)*z;const dw=I.width*s,dh=I.height*s;
  const ox=x+(w-dw)/2+px*(dw-w)/2, oy=y+(h-dh)/2+py*(dh-h)/2;
  ctx.save();ctx.beginPath();ctx.rect(x,y,w,h);ctx.clip();ctx.globalAlpha*=alpha;ctx.drawImage(I,ox,oy,dw,dh);ctx.restore()}
function kb(img,t,a,b,opt={}){ // full-screen ken burns
  const p=P(t,a,b);const z0=opt.z0||1.04,z1=opt.z1||1.16;
  cover(img,opt.x||0,opt.y||0,opt.w||W,opt.h||H,lerp(z0,z1,p),lerp(opt.px0||0,opt.px1||0,p),lerp(opt.py0||0,opt.py1||0,p),opt.alpha??1)}
function shade(a,col=DEEP){ctx.save();ctx.globalAlpha=a;ctx.fillStyle=col;ctx.fillRect(0,0,W,H);ctx.restore()}
function gradShade(){const g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,'rgba(5,22,52,.95)');g.addColorStop(.28,'rgba(5,22,52,.35)');g.addColorStop(.7,'rgba(5,22,52,.35)');g.addColorStop(1,'rgba(5,22,52,.95)');ctx.fillStyle=g;ctx.fillRect(0,0,W,H)}
function navyBG(t){const g=ctx.createRadialGradient(W/2,H*.45,50,W/2,H*.45,H*.8);g.addColorStop(0,'#123a7a');g.addColorStop(1,DEEP);ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
  ctx.save();ctx.globalAlpha=.07;ctx.strokeStyle='#7fa6ff';ctx.lineWidth=1;const off=(t*12)%60;for(let x=-60+off;x<W+60;x+=60){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,H);ctx.stroke()}for(let y=-60+off;y<H;y+=60){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(W,y);ctx.stroke()}ctx.restore()}
// kicker pill + title
function header(t,t0,kick,title,y=500){
  const p=eo(P(t,t0,t0+.45));if(p<=0)return;
  ctx.save();ctx.globalAlpha=p;
  const kw=tw(kick,'IB',30,4)+44;const x0=W/2-kw/2;
  ctx.translate(0,(1-p)*30);
  rr(x0,y-48,kw,54,8);ctx.fillStyle=RED;ctx.fill();
  txt(kick,W/2+2,y-10,'IB',30,WHITE,'center',4);
  if(title){txt(title,W/2,y+82,'IDB',74,WHITE,'center',1)}
  ctx.restore()}
// icons
function iconMail(x,y,s,col){ctx.save();ctx.translate(x,y);ctx.strokeStyle=col;ctx.lineWidth=s*.08;ctx.lineJoin='round';rr(-s*.5,-s*.34,s,s*.68,s*.08);ctx.stroke();ctx.beginPath();ctx.moveTo(-s*.46,-s*.28);ctx.lineTo(0,s*.06);ctx.lineTo(s*.46,-s*.28);ctx.stroke();ctx.restore()}
function iconVideo(x,y,s,col){ctx.save();ctx.translate(x,y);ctx.strokeStyle=col;ctx.lineWidth=s*.08;ctx.lineJoin='round';rr(-s*.52,-s*.3,s*.7,s*.6,s*.1);ctx.stroke();ctx.beginPath();ctx.moveTo(s*.22,-s*.08);ctx.lineTo(s*.52,-s*.26);ctx.lineTo(s*.52,s*.26);ctx.lineTo(s*.22,s*.08);ctx.closePath();ctx.stroke();ctx.restore()}
function iconBank(x,y,s,col){ctx.save();ctx.translate(x,y);ctx.fillStyle=col;ctx.beginPath();ctx.moveTo(-s*.5,-s*.18);ctx.lineTo(0,-s*.48);ctx.lineTo(s*.5,-s*.18);ctx.closePath();ctx.fill();for(let i=0;i<4;i++){ctx.fillRect(-s*.4+i*s*.25,-s*.1,s*.1,s*.42)}ctx.fillRect(-s*.5,s*.36,s,s*.1);ctx.restore()}
function planePath(s){ctx.beginPath();ctx.moveTo(s*.55,0);ctx.quadraticCurveTo(s*.5,-s*.06,s*.3,-s*.06);ctx.lineTo(s*.05,-s*.06);ctx.lineTo(-s*.2,-s*.5);ctx.lineTo(-s*.32,-s*.5);ctx.lineTo(-s*.18,-s*.06);ctx.lineTo(-s*.42,-s*.06);ctx.lineTo(-s*.52,-s*.22);ctx.lineTo(-s*.6,-s*.22);ctx.lineTo(-s*.54,0);ctx.lineTo(-s*.6,s*.22);ctx.lineTo(-s*.52,s*.22);ctx.lineTo(-s*.42,s*.06);ctx.lineTo(-s*.18,s*.06);ctx.lineTo(-s*.32,s*.5);ctx.lineTo(-s*.2,s*.5);ctx.lineTo(s*.05,s*.06);ctx.lineTo(s*.3,s*.06);ctx.quadraticCurveTo(s*.5,s*.06,s*.55,0);ctx.closePath()}
function iconPlane(x,y,s,col,ang=-Math.PI/4){ctx.save();ctx.translate(x,y);ctx.rotate(ang);ctx.fillStyle=col;planePath(s);ctx.fill();ctx.restore()}
function iconPhone(x,y,s,col){ctx.save();ctx.translate(x,y);ctx.strokeStyle=col;ctx.lineWidth=s*.08;rr(-s*.28,-s*.48,s*.56,s*.96,s*.1);ctx.stroke();ctx.fillStyle=col;ctx.fillRect(-s*.08,s*.34,s*.16,s*.05);ctx.font=F('IDB',s*.42);ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText('$',0,-s*.02);ctx.restore()}
function redX(x,y,s,p){if(p<=0)return;ctx.save();ctx.translate(x,y);ctx.strokeStyle=RED;ctx.lineCap='round';ctx.lineWidth=s*.12;ctx.shadowColor=RED;ctx.shadowBlur=20;
  const a=clamp(p*2),b=clamp(p*2-1);ctx.beginPath();ctx.moveTo(-s/2,-s/2);ctx.lineTo(-s/2+s*a,-s/2+s*a);ctx.stroke();if(b>0){ctx.beginPath();ctx.moveTo(s/2,-s/2);ctx.lineTo(s/2-s*b,-s/2+s*b);ctx.stroke()}ctx.restore()}
function iconLock(x,y,s,col,closed){ctx.save();ctx.translate(x,y);ctx.strokeStyle=col;ctx.fillStyle=col;ctx.lineWidth=s*.11;ctx.lineCap='round';
  const lift=(1-closed)*s*.22;ctx.beginPath();ctx.moveTo(-s*.26,-s*.02-lift*0);ctx.lineTo(-s*.26,-s*.28-lift);ctx.arc(0,-s*.28-lift,s*.26,Math.PI,0);ctx.lineTo(s*.26,-s*.02-lift+ (1-closed)*s*.0);ctx.stroke();
  rr(-s*.42,-s*.04,s*.84,s*.62,s*.09);ctx.fill();ctx.fillStyle=DEEP;ctx.beginPath();ctx.arc(0,s*.2,s*.08,0,7);ctx.fill();ctx.fillRect(-s*.03,s*.22,s*.06,s*.16);ctx.restore()}
// ---------- glitch post ----------
function glitch(amount,seed){
  if(amount<=0.01)return;const r=rng(seed);
  const img=ctx.getImageData(0,0,W,H);const d=img.data;const out=ctx.createImageData(W,H);const o=out.data;
  const sh=Math.round(amount*26);
  // rgb split with row slices
  let y=0;while(y<H){const hgt=Math.floor(8+r()*90);const off=(r()<.45?Math.round((r()-.5)*amount*220):0);
    for(let yy=y;yy<Math.min(H,y+hgt);yy++){const row=yy*W*4;for(let x=0;x<W;x++){const i=row+x*4;
      const xr=Math.min(W-1,Math.max(0,x-off+sh)),xg=Math.min(W-1,Math.max(0,x-off)),xb=Math.min(W-1,Math.max(0,x-off-sh));
      o[i]=d[row+xr*4];o[i+1]=d[row+xg*4+1];o[i+2]=d[row+xb*4+2];o[i+3]=255}}
    y+=hgt}
  ctx.putImageData(out,0,0);
  // blocks
  ctx.save();for(let k=0;k<amount*10;k++){ctx.globalAlpha=.35+r()*.4;ctx.fillStyle=r()<.5?RED:(r()<.5?'#2f7bff':'#fff');ctx.fillRect(r()*W,r()*H,40+r()*400,3+r()*16)}ctx.restore();
  // scanlines
  ctx.save();ctx.globalAlpha=.12*amount;ctx.fillStyle='#000';for(let yy=0;yy<H;yy+=4)ctx.fillRect(0,yy,W,2);ctx.restore()}
// local glitch on region (cheap)
function regionGlitch(x,y,w,h,amount,seed){if(amount<=0.01)return;const r=rng(seed);
  const tmp=ctx.getImageData(x,y,w,h);ctx.save();ctx.beginPath();ctx.rect(x,y,w,h);ctx.clip();
  for(let k=0;k<12;k++){const sy=Math.floor(r()*h),sh=Math.floor(6+r()*50);const off=(r()-.5)*amount*160;ctx.putImageData(tmp,x+off,y,0,sy,w,sh)}
  for(let k=0;k<amount*6;k++){ctx.globalAlpha=.5;ctx.fillStyle=r()<.5?RED:'#2f7bff';ctx.fillRect(x+r()*w,y+r()*h,30+r()*200,2+r()*10)}
  ctx.restore()}
// grain
const grains=[];function makeGrain(){for(let k=0;k<4;k++){const c=document.createElement('canvas');c.width=c.height=256;const g=c.getContext('2d');const id=g.createImageData(256,256);const r=rng(k*99+7);for(let i=0;i<id.data.length;i+=4){const v=r()*255;id.data[i]=id.data[i+1]=id.data[i+2]=v;id.data[i+3]=22}g.putImageData(id,0,0);grains.push(c)}}
function grain(f){const c=grains[f%4];const r=rng(f);const ox=-Math.floor(r()*256),oy=-Math.floor(r()*256);ctx.save();ctx.globalCompositeOperation='overlay';for(let x=ox;x<W;x+=256)for(let y=oy;y<H;y+=256)ctx.drawImage(c,x,y);ctx.restore()}
function vignette(){const g=ctx.createRadialGradient(W/2,H/2,H*.3,W/2,H/2,H*.75);g.addColorStop(0,'rgba(0,0,0,0)');g.addColorStop(1,'rgba(0,0,0,.55)');ctx.fillStyle=g;ctx.fillRect(0,0,W,H)}
// ---------- subtitles ----------
let CHUNKS=[];
function buildChunks(){let cur=[];const ws=WORDS.map(w=>({w:w[0],s:w[1],e:w[2]}));
  for(let i=0;i<ws.length;i++){const w=ws[i];cur.push(w);const nx=ws[i+1];
    const len=cur.map(c=>c.w).join(' ').length;
    if(!nx||/[.,?!]$/.test(w.w)||cur.length>=4||len>22||nx.s-w.e>.35){CHUNKS.push(cur);cur=[]}}
  CHUNKS.forEach((c,i)=>{c.start=c[0].s;const nx=CHUNKS[i+1];c.end=nx?Math.min(nx[0].s,c[c.length-1].e+.6):c[c.length-1].e+.8})}
function subs(t){
  const c=CHUNKS.find(c=>t>=c.start-.02&&t<c.end);if(!c)return;
  const fam='IDX',size=66,ls=0;ctx.save();ctx.font=F(fam,size);
  const items=c.map(w=>({...w,txt:w.w.toUpperCase(),wd:ctx.measureText(w.w.toUpperCase()).width}));
  const sp=18;const maxW=940;const lines=[[]];let lw=0;
  items.forEach(it=>{if(lw+it.wd>maxW&&lines[lines.length-1].length){lines.push([]);lw=0}lines[lines.length-1].push(it);lw+=it.wd+sp});
  const lh=84;const top=330-(lines.length-1)*lh/2;
  lines.forEach((ln,li)=>{const tot=ln.reduce((a,b)=>a+b.wd,0)+sp*(ln.length-1);let x=W/2-tot/2;const y=top+li*lh;
    ln.forEach(it=>{if(t>=it.s-.03){const act=t<it.e+.05&&t>=it.s-.03;const pp=eback(P(t,it.s-.03,it.s+.12));
      ctx.save();ctx.translate(x+it.wd/2,y);ctx.scale(.7+.3*pp,.7+.3*pp);
      if(act){ctx.fillStyle=RED;rr(-it.wd/2-10,-58,it.wd+20,74,10);ctx.fill()}
      ctx.lineJoin='round';ctx.lineWidth=10;ctx.strokeStyle='rgba(3,12,30,.85)';ctx.textAlign='center';
      if(!act)ctx.strokeText(it.txt,0,0);ctx.fillStyle=WHITE;ctx.fillText(it.txt,0,0);ctx.restore()}
      x+=it.wd+sp})});
  ctx.restore()}
function topBand(){const g=ctx.createLinearGradient(0,0,0,560);g.addColorStop(0,'rgba(3,12,30,.75)');g.addColorStop(1,'rgba(3,12,30,0)');ctx.fillStyle=g;ctx.fillRect(0,0,W,560)}
function watermark(t){ctx.save();ctx.globalAlpha=.55;txt('@capitalcuriosoo',W/2,1858,'IS',26,WHITE,'center',2);ctx.restore()}
// ---------- SCENES ----------
const S1=0,S2=12.3,S3=22.6,S3b=27.0,S3c=30.2,S4=34.4,S4b=40.05,S4c=42.0,S5=46.0,S5b=51.0,S6=54.0,S6b=57.6,S7=62.1,END=65.6;
// 1. HOOK
const panels=[{img:'laptop',icon:'mail',lab:'CORREO',day:'JUEVES',dayT:0.0,off:1.02,pos:[0,.3]},{img:'plane',icon:'plane',lab:'VUELOS',day:'VIERNES',dayT:2.58,off:3.48,pos:[0,.4]},{img:'cardphone',icon:'bank',lab:'BANCOS',day:'LUNES',dayT:6.38,off:7.12,pos:[0,.1]}];
function scene1(t,f){
  navyBG(t);
  if(t<10.04){
  const PX=40,PW=1000,PH=372,gap=26,Y0=520;
  panels.forEach((p,i)=>{const y=Y0+i*(PH+gap);const ap=eo(P(t,i*.12,i*.12+.5));if(ap<=0)return;
    const out=P(t,9.55,10.0);
    ctx.save();ctx.globalAlpha=ap*(1-out);ctx.translate((1-ap)*(i%2?120:-120),0);
    rr(PX,y,PW,PH,22);ctx.save();ctx.clip();
    const off=t>=p.off+.35;const flick=t>=p.off&&t<p.off+.35;
    cover(p.img,PX,y,PW,PH,1.05+.12*P(t,0,10),0,p.pos[1]);
    if(flick){const r=rng(f*7+i);ctx.fillStyle=r()<.5?'rgba(0,0,0,.8)':'rgba(255,255,255,.25)';ctx.fillRect(PX,y,PW,PH)}
    if(off){const k=P(t,p.off+.35,p.off+.7);ctx.fillStyle=`rgba(2,6,16,${.55+.38*k})`;ctx.fillRect(PX,y,PW,PH);
      // collapse line (CRT off)
      const c=P(t,p.off+.35,p.off+.55);if(c<1){ctx.fillStyle='rgba(255,255,255,'+(1-c)+')';ctx.fillRect(PX,y+PH/2-2*(1-c)*PH/4,PW,4+(1-c)*PH/2)}
      ctx.globalAlpha=.08;ctx.fillStyle='#fff';for(let yy=y;yy<y+PH;yy+=6)ctx.fillRect(PX,yy,PW,1);ctx.globalAlpha=1}
    else{const g=ctx.createLinearGradient(0,y,0,y+PH);g.addColorStop(0,'rgba(5,22,52,.1)');g.addColorStop(1,'rgba(5,22,52,.65)');ctx.fillStyle=g;ctx.fillRect(PX,y,PW,PH)}
    ctx.restore();
    if(flick)regionGlitch(PX,y,PW,PH,1,f*13+i);
    // frame
    rr(PX,y,PW,PH,22);ctx.lineWidth=3;ctx.strokeStyle=off?'rgba(254,74,85,.8)':'rgba(255,255,255,.25)';ctx.stroke();
    // icon + label
    const ix=PX+70,iy=y+PH-62;ctx.fillStyle=off?'rgba(254,74,85,.25)':'rgba(10,40,90,.85)';ctx.beginPath();ctx.arc(ix,iy,38,0,7);ctx.fill();
    const icol=off?RED:WHITE;if(p.icon=='mail')iconMail(ix,iy,40,icol);else if(p.icon=='plane')iconPlane(ix,iy,46,icol);else iconBank(ix,iy,40,icol);
    txt(p.lab,ix+58,iy+12,'IB',34,WHITE,'left',4);
    if(off)txt('SIN SERVICIO',PX+PW-36,iy+12,'IB',28,RED,'right',3,P(t,p.off+.5,p.off+.8));
    // day label (red rotulo)
    const dp=eback(P(t,p.dayT,p.dayT+.35));if(dp>0){ctx.save();ctx.translate(W/2,y+PH/2-24);const sc=off?1:.62;ctx.scale(dp*sc,dp*sc);
      const lw=tw(p.day,'IDB',96,6)+70;rr(-lw/2,-70,lw,120,14);ctx.fillStyle=RED;ctx.shadowColor='rgba(254,74,85,.7)';ctx.shadowBlur=off?40:0;ctx.fill();ctx.shadowBlur=0;txt(p.day,3,22,'IDB',96,WHITE,'center',6);ctx.restore()}
    ctx.restore()})}
  // ¿CASUALIDAD?
  const cp=P(t,10.0,10.3);if(cp>0){kb('errorphone',t,10,12.4,{z0:1.25,z1:1.4,alpha:cp});shade(.62);vignette();
    const s=eback(cp);ctx.save();ctx.translate(W/2,1010);ctx.scale(lerp(1.6,1,s),lerp(1.6,1,s));ctx.globalAlpha=clamp(cp*2);
    ctx.shadowColor='rgba(254,74,85,.8)';ctx.shadowBlur=50;txt('¿CASUALIDAD?',0,40,'IDB',138,WHITE,'center',0);ctx.shadowBlur=0;
    ctx.fillStyle=RED;ctx.fillRect(-300*eo(P(t,10.3,10.8)),80,600*eo(P(t,10.3,10.8)),12);ctx.restore();
    txt('O ALGO MÁS',W/2,1200,'IB',46,MUTED,'center',10,P(t,11.3,11.7))}
}
// 2. MICROSOFT
const LIT=['United States of America','Canada','Mexico','Brazil','United Kingdom','France','Germany','Spain','Italy','Japan','India','Australia','Argentina','Colombia','Chile','Peru','Netherlands','Belgium','Portugal','Ireland','Sweden','Norway','Finland','Denmark','Poland','Austria','Switzerland','South Africa','Nigeria','Egypt','Saudi Arabia','United Arab Emirates','Turkey','South Korea','Philippines','Indonesia','Malaysia','Thailand','Vietnam','New Zealand','Israel','Kenya','Morocco','Venezuela','Ecuador','Guatemala','Costa Rica','Panama','Dominican Rep.','Cuba','Uruguay','Paraguay','Bolivia','Czechia','Hungary','Romania','Greece','Ukraine','Kazakhstan','Pakistan','Bangladesh','Sri Lanka','Taiwan','Qatar','Kuwait','Jordan','Ghana','Algeria','Tunisia','Iceland','Croatia','Serbia','Slovakia','Honduras'];
function drawWorld(x,y,w,h,t,litStart,litEnd){
  const G=GEO.world;const order={};LIT.forEach((n,i)=>order[n]=i);
  G.forEach(c=>{if(c.name==='Antarctica'||c.name==='Fr. S. Antarctic Lands')return;const i=order[c.name];let k=0;
    if(i!==undefined){const tt=litStart+(litEnd-litStart)*Math.pow(i/LIT.length,0.85);k=P(t,tt,tt+.25)}
    ctx.beginPath();c.p.forEach(r=>{r.forEach((pt,j)=>{const X=x+pt[0]*w,Y=y+pt[1]*h;j?ctx.lineTo(X,Y):ctx.moveTo(X,Y)});ctx.closePath()});
    ctx.fillStyle=k>0?mixHex('#1a4385',RED,k):'#1a4385';if(k>0&&k<1){ctx.shadowColor=RED;ctx.shadowBlur=30*(1-k)}ctx.fill();ctx.shadowBlur=0;
    ctx.lineWidth=1.2;ctx.strokeStyle=k>.5?'#ff9aa0':'#3768b8';ctx.stroke()});
  let n=0;LIT.forEach((nm,i)=>{const tt=litStart+(litEnd-litStart)*Math.pow(i/LIT.length,0.85);if(t>=tt)n++});return n}
function scene2(t,f){
  kb('ms',t,S2,S3,{z0:1.1,z1:1.25,px0:-.2,px1:.2});shade(.8);navyOverlayGrid(t);
  header(t,S2+.05,'JUEVES','MICROSOFT');
  // map
  const ap=eo(P(t,S2+.2,S2+.8));ctx.save();ctx.globalAlpha=ap;
  const mx=20,my=640,mw=1040,mh=mw*141/360;
  const n=drawWorld(mx,my,mw,mh,t,13.0,17.9);ctx.restore();
  // counter
  const cnt=Math.min(70,Math.round(n/LIT.length*70*1.0));const done=t>=17.6;

  pts.forEach((p,i)=>{const a=eback(P(t,54.4+i*.35,54.75+i*.35));if(a<=0)return;ctx.save();ctx.translate(p[0],Y);ctx.scale(a,a);
    ctx.beginPath();ctx.arc(0,0,58,0,7);ctx.fillStyle=NAVY;ctx.fill();ctx.lineWidth=5;ctx.strokeStyle=RED;ctx.stroke();

  const sp=P(t,56.55,56.8);if(sp>0){ctx.save();ctx.translate(W/2,1340);ctx.rotate(-.06);const s=lerp(2.2,1,eo(sp));ctx.scale(s,s);ctx.globalAlpha=clamp(sp*2);
    rr(-400,-80,800,160,14);ctx.lineWidth=10;ctx.strokeStyle=RED;ctx.stroke();txt('SIN RELACIÓN OFICIAL',0,22,'IDB',64,RED,'center',2);ctx.restore()}
}
const LEDS=Array.from({length:70},(_,i)=>{const r=rng(i*3+11);return[r()*.62,r(),r()*6.28,r()*3+2]});
function scene6b(t,f){
  kb('servers',t,S6b,S7,{z0:1.05,z1:1.22,px0:-.2,px1:.1});
  // red tint
  ctx.save();ctx.globalCompositeOperation='multiply';ctx.fillStyle='#7a8fc0';ctx.fillRect(0,0,W,H);ctx.restore();shade(.35);

  const fl=(Math.sin(t*13)>.85)?.18:0;if(fl){ctx.save();ctx.globalAlpha=fl;ctx.fillStyle=RED;ctx.fillRect(0,0,W,H);ctx.restore()}

  ctx.save();ctx.shadowColor='rgba(0,0,0,.8)';ctx.shadowBlur=30;

  if(q3>0)txt('es el sistema?',W/2,1310+(1-q3)*30,'IDB',100,WHITE,'center',0,q3);
  ctx.restore()
}
// 7. ENCUESTA
function scene7(t,f){
  kb('gaming',t,S7,END+.5,{z0:1.1,z1:1.2});shade(.86,DEEP);navyOverlayGrid(t);
  const p=eback(P(t,S7,S7+.4));ctx.save();ctx.translate(W/2,1000);ctx.scale(p,p);

// transitions
const CUTS=[S2,S3,S3b,S3c,S4,S4b,S4c,S5,S6,S6b,S7,10.0,36.68,37.36,38.42,39.22];
function render(f){
  const t=f/30;ctx.save();ctx.fillStyle='#000';ctx.fillRect(0,0,W,H);
  if(t<S2)scene1(t,f);else if(t<S3)scene2(t,f);else if(t<S3b)scene3a(t,f);else if(t<S3c)scene3b(t,f);else if(t<S4)scene3c(t,f);
  else if(t<S4b)scene4a(t,f);else if(t<S4c)scene4b(t,f);else if(t<S5)scene4c(t,f);else if(t<S6)scene5(t,f);else if(t<S6b)scene6a(t,f);else if(t<S7)scene6b(t,f);else scene7(t,f);
  ctx.restore();
  vignette();grain(f);
  // glitch transitions
  let g=0;CUTS.forEach(c=>{const d=Math.abs(t-c);if(d<.17)g=Math.max(g,1-d/.17)});
  if(g>0)glitch(g,f*17+3);
  if(t<END-.3){topBand();subs(t)}
  if(t>1&&t<END-.3)watermark(t);
}
function scene4cWrap(t,f){ctx.save();ctx.fillStyle='#000';ctx.fillRect(0,0,W,H);scene4c(t,f);ctx.restore()}
window.render=render;
